<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060503">
  <title>字造集 · 入字</title>
  <style>
    :root {
      --paper: #f5f0e6;
      --gold: #c9a856;
      --seal: #a83f39;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      color: var(--paper);
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('kaichangbeijingtu.jpg') center center / cover no-repeat;
      transform: scale(1.04);
    }

    /* Canvas sits on top for glass cursor + handwriting */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      touch-action: none;
      cursor: none;
    }

    /* Faint guide character */
    .guide {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      font-size: clamp(240px, 52vw, 560px);
      font-weight: 700;
      color: rgba(245, 240, 230, 0.055);
      pointer-events: none;
      letter-spacing: 0;
      text-shadow: 0 0 60px rgba(245,240,230,0.08);
      transition: opacity 0.6s ease, color 0.6s ease;
    }
    .guide.glow {
      color: rgba(245, 240, 230, 0.18);
      text-shadow: 0 0 80px rgba(201, 168, 86, 0.45);
    }

    /* UI hints */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px 34px;
    }

    .topline {
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeDown 1.2s ease 0.3s forwards;
    }
    .topline h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      letter-spacing: 0.45em;
      text-indent: 0.45em;
      font-weight: 700;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .topline p {
      margin-top: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: rgba(245,240,230,0.55);
    }

    .hint {
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: rgba(245,240,230,0.5);
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      opacity: 0;
      animation: fadeUp 1.2s ease 0.8s forwards;
    }

    .controls {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 4;
      pointer-events: auto;
    }
    .controls button {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(245,240,230,0.22);
      color: rgba(245,240,230,0.8);
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      padding: 7px 12px;
      border-radius: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: all 0.3s ease;
    }
    .controls button:hover { background: rgba(0,0,0,0.55); color: var(--paper); }
    #enterBtn { display: none; }
    #enterBtn.show { display: inline-block; }

    .success-ring {
      position: fixed;
      left: 50%; top: 50%;
      width: 120vmax; height: 120vmax;
      transform: translate(-50%, -50%) scale(0);
      z-index: 5;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,86,0.18) 0%, transparent 55%);
      pointer-events: none;
      transition: transform 1.4s cubic-bezier(0.22,1,0.36,1), opacity 1s ease;
    }
    .success-ring.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
    }

    .success-text {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      font-weight: 700;
      color: var(--paper);
      text-shadow: 0 0 60px rgba(201,168,86,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .success-text.show { opacity: 1; }

    @keyframes fadeDown { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    @media (min-width: 768px) {
      .topline p { font-size: 0.84rem; }
      .hint { font-size: 0.86rem; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="guide" id="guide">字</div>
  <canvas id="canvas"></canvas>

  <div class="ui-layer">
    <div class="topline">
      <h1>字造集</h1>
      <p>挥毫入境 · 以字为钥</p>
    </div>
    <div class="hint" id="hint">以光标为笔，在虚空中书写「字」字，即可入字</div>
  </div>

  <div class="controls">
    <button id="clearBtn">重写</button>
    <button id="enterBtn">入境</button>
  </div>

  <div class="success-ring" id="successRing"></div>
  <div class="success-text" id="successText">入字</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    const guide = document.getElementById('guide');
    const hint = document.getElementById('hint');
    const bg = document.getElementById('bg');
    const successRing = document.getElementById('successRing');
    const successText = document.getElementById('successText');

    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ---------- Glass cursor trail state ----------
    const trail = [];          // {x, y, r, age, life}
    const TRAIL_LIFE = 28;
    const TRAIL_INTERVAL = 2;  // add a node every N pixels moved
    let lastTrailX = 0, lastTrailY = 0;
    let pointer = { x: W/2, y: H/2 };
    let isDown = false;

    // ---------- Handwriting state ----------
    const strokes = [];        // array of strokes, each stroke is array of points {x,y,t}
    let currentStroke = null;

    // ---------- Template for 字 ----------
    // 6 normalized strokes stored in a 0..1 square (centered at 0.5,0.5)
    const templateStrokes = [
      // 1. 点（宀 left dot）
      [{x:0.32,y:0.18},{x:0.28,y:0.26}],
      // 2. 左竖点/短竖（宀 right vertical dot）
      [{x:0.72,y:0.18},{x:0.72,y:0.27}],
      // 3. 横钩（宀 top + hook）
      [{x:0.22,y:0.27},{x:0.50,y:0.27},{x:0.78,y:0.27},{x:0.78,y:0.34}],
      // 4. 横撇（子 top）
      [{x:0.35,y:0.44},{x:0.65,y:0.44},{x:0.62,y:0.58}],
      // 5. 竖钩（子 vertical hook）
      [{x:0.50,y:0.44},{x:0.50,y:0.72},{x:0.50,y:0.80},{x:0.58,y:0.74}],
      // 6. 长横（子 bottom）
      [{x:0.28,y:0.80},{x:0.72,y:0.80}]
    ];

    // Map normalized template to screen coordinates centered in viewport
    function charBox() {
      const size = Math.min(W, H) * 0.55;
      return {
        cx: W / 2,
        cy: H / 2,
        size,
        x0: W/2 - size/2,
        y0: H/2 - size/2
      };
    }

    function normToScreen(pt) {
      const b = charBox();
      return { x: b.x0 + pt.x * b.size, y: b.y0 + pt.y * b.size };
    }

    function screenToNorm(pt) {
      const b = charBox();
      return { x: (pt.x - b.x0) / b.size, y: (pt.y - b.y0) / b.size };
    }

    // ---------- Events ----------
    function onDown(e) {
      isDown = true;
      const p = getPos(e);
      pointer.x = p.x; pointer.y = p.y;
      currentStroke = [{ x: p.x, y: p.y, t: performance.now() }];
      addTrail(p.x, p.y, true);
    }

    function onMove(e) {
      const p = getPos(e);
      pointer.x = p.x; pointer.y = p.y;
      if (isDown && currentStroke) {
        currentStroke.push({ x: p.x, y: p.y, t: performance.now() });
      }
      addTrail(p.x, p.y, false);
    }

    function onUp() {
      if (!isDown) return;
      isDown = false;
      if (currentStroke && currentStroke.length > 4) {
        strokes.push(currentStroke);
        evaluate();
      }
      currentStroke = null;
    }

    function getPos(e) {
      if (e.touches && e.touches.length) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);

    // Touch pinch zoom protection
    canvas.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    document.getElementById('clearBtn').addEventListener('click', () => {
      strokes.length = 0;
      currentStroke = null;
      failCount = 0;
      guide.classList.remove('glow');
      hint.textContent = '以光标为笔，在虚空中书写「字」字，即可入字';
      hint.style.color = 'rgba(245,240,230,0.5)';
    });

    document.getElementById('enterBtn').addEventListener('click', () => {
      if (!transitioned) { transitioned = true; goGallery(); }
    });

    // ---------- Trail logic ----------
    function addTrail(x, y, force) {
      if (!force) {
        const dx = x - lastTrailX;
        const dy = y - lastTrailY;
        if (dx*dx + dy*dy < TRAIL_INTERVAL * TRAIL_INTERVAL) return;
      }
      lastTrailX = x; lastTrailY = y;
      trail.push({ x, y, r: 10 + Math.random()*4, age: 0, life: TRAIL_LIFE });
    }

    // ---------- Recognition ----------
    let failCount = 0;

    function evaluate() {
      if (strokes.length < 2) return;

      // Gather all ink and total stroke length
      let allPts = [];
      let totalLen = 0;
      for (const st of strokes) {
        for (let i = 0; i < st.length; i++) {
          allPts.push(st[i]);
          if (i > 0) totalLen += Math.hypot(st[i].x - st[i-1].x, st[i].y - st[i-1].y);
        }
      }

      // How much of the writing overlaps the central character box
      const b = charBox();
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of allPts) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      const ovX = Math.max(0, Math.min(maxX, b.x0 + b.size) - Math.max(minX, b.x0)) / Math.max(1, b.size);
      const ovY = Math.max(0, Math.min(maxY, b.y0 + b.size) - Math.max(minY, b.y0)) / Math.max(1, b.size);
      const coverage = ovX * ovY;

      // Shape similarity against the 字 template (normalized)
      let tmplSim = 0;
      if (strokes.length >= 3) {
        const userPath = resample(allPts, 64);
        const tplPath = resample(templateStrokes.flat().map(p => normToScreen(p)), 64);
        tmplSim = strokeSimilarity(userPath, tplPath);
      }

      // Pass if the user wrote enough strokes inside the box, or the shape matches
      const geomOk = strokes.length >= 3 && totalLen > b.size * 0.5 && coverage > 0.15;
      const pass = geomOk || tmplSim > 0.6;

      if (pass) {
        onSuccess();
      } else {
        failCount++;
        guide.classList.remove('glow');
        if (failCount >= 2) {
          hint.innerHTML = '笔迹未成 · 可点右上「入境」直接进入';
          showEnterButton();
        } else {
          hint.textContent = '笔迹未成，请依虚影再写一次「字」';
        }
        hint.style.color = 'rgba(200,160,120,0.85)';
      }
    }

    function resample(pts, n) {
      if (pts.length < 2) return pts;
      const out = [pts[0]];
      let total = 0;
      for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
      if (total === 0) return pts;
      const step = total / (n - 1);
      let cur = 0;
      let i = 1;
      while (out.length < n && i < pts.length) {
        const d = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
        if (cur + d >= step) {
          const t = (step - cur) / d;
          out.push({
            x: pts[i-1].x + (pts[i].x - pts[i-1].x) * t,
            y: pts[i-1].y + (pts[i].y - pts[i-1].y) * t
          });
          pts.splice(i - 1, 1);
          pts[i - 1] = out[out.length - 1];
          cur = 0;
        } else {
          cur += d;
          i++;
        }
      }
      while (out.length < n) out.push(pts[pts.length - 1]);
      return out;
    }

    function strokeSimilarity(a, b) {
      // Scale / translate invariant via normalization to bounding box
      const na = normalizeStroke(a);
      const nb = normalizeStroke(b);
      let sum = 0;
      for (let i = 0; i < na.length; i++) {
        const dx = na[i].x - nb[i].x;
        const dy = na[i].y - nb[i].y;
        sum += Math.exp(-(dx*dx + dy*dy) * 4);
      }
      return sum / na.length;
    }

    function normalizeStroke(pts) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of pts) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      const w = Math.max(maxX - minX, 0.001);
      const h = Math.max(maxY - minY, 0.001);
      const s = Math.max(w, h);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      return pts.map(p => ({ x: (p.x - cx) / s, y: (p.y - cy) / s }));
    }

    // ---------- Success transition ----------
    function goGallery() {
      const url = new URL('zizao-gallery.html', location.href).href;
      window.location.assign(url);
      // Fallback notice if navigation didn't happen (e.g. target missing)
      setTimeout(() => {
        if (document.visibilityState !== 'hidden') {
          hint.textContent = '未能自动跳转：请确认 zizao-gallery.html 与本页在同一目录';
          hint.style.color = 'rgba(200,160,120,0.9)';
        }
      }, 1600);
    }

    function showEnterButton() {
      const btn = document.getElementById('enterBtn');
      if (btn) btn.classList.add('show');
    }

    let transitioned = false;
    function onSuccess() {
      if (transitioned) return;
      transitioned = true;
      guide.classList.add('glow');
      hint.textContent = '字已成，入境中…';
      hint.style.color = 'var(--gold)';

      // Freeze drawing
      canvas.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);

      successRing.classList.add('open');
      successText.classList.add('show');

      setTimeout(() => {
        // Smooth fade out then navigate
        document.body.style.transition = 'opacity 1.2s ease';
        document.body.style.opacity = '0';
        setTimeout(goGallery, 1200);
      }, 900);
    }

    // ---------- Render loop ----------
    function render() {
      ctx.clearRect(0, 0, W, H);

      // 1) Draw glass refraction disk under current pointer
      drawGlassDisk(pointer.x, pointer.y);

      // 2) Update and draw trail
      for (let i = trail.length - 1; i >= 0; i--) {
        const p = trail[i];
        p.age++;
        if (p.age >= p.life) { trail.splice(i, 1); continue; }
      }
      drawTrail();

      // 3) Draw user's ink strokes
      drawInk();

      requestAnimationFrame(render);
    }

    function drawGlassDisk(x, y) {
      const r = 34;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      // Refractive bright ring
      const g = ctx.createRadialGradient(x, y, r*0.25, x, y, r);
      g.addColorStop(0, 'rgba(245,240,230,0.18)');
      g.addColorStop(0.5, 'rgba(245,240,230,0.06)');
      g.addColorStop(1, 'rgba(245,240,230,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fill();

      // Blurred inner glass core
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'blur(6px)';
      const g2 = ctx.createRadialGradient(x, y, 0, x, y, r*0.7);
      g2.addColorStop(0, 'rgba(245,240,230,0.10)');
      g2.addColorStop(1, 'rgba(245,240,230,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(x, y, r*0.7, 0, Math.PI*2);
      ctx.fill();
      ctx.filter = 'none';
      ctx.restore();
    }

    function drawTrail() {
      if (trail.length < 2) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 0; i < trail.length - 1; i++) {
        const a = trail[i];
        const b = trail[i+1];
        const life = 1 - a.age / a.life;
        const width = 2 + life * 10;
        ctx.globalCompositeOperation = 'screen';
        ctx.strokeStyle = `rgba(230, 220, 200, ${0.12 * life})`;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        // Small glass bead at each node
        ctx.globalCompositeOperation = 'source-over';
        const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, width * 1.2);
        g.addColorStop(0, `rgba(245,240,230,${0.22 * life})`);
        g.addColorStop(1, 'rgba(245,240,230,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(a.x, a.y, width * 1.2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawInk() {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(201, 168, 86, 0.55)';

      const all = [...strokes];
      if (currentStroke) all.push(currentStroke);

      for (const stroke of all) {
        if (stroke.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          const p = stroke[i];
          const prev = stroke[i-1];
          const mx = (prev.x + p.x) / 2;
          const my = (prev.y + p.y) / 2;
          ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
        }
        ctx.lineTo(stroke[stroke.length-1].x, stroke[stroke.length-1].y);
        ctx.strokeStyle = 'rgba(245, 240, 230, 0.88)';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(201, 168, 86, 0.55)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
      ctx.restore();
    }

    render();
  </script>
</body>
</html>
