<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>字造集 · 汉字情绪画廊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-900: #000000;
      --paper-100: #f5f0e6;
      --paper-200: #e8e0d0;
      --paper-300: #9a9486;
      --seal: #a83f39;
      --seal-light: #c45c52;
      --gold: #b89b4a;
      --perspective: 1500px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink-900);
      color: var(--paper-100);
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
    }

    /* Pure black infinite void */
    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 50% 46%, rgba(20, 18, 16, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.85) 100%),
        #000;
    }

    /* Header */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 26px 20px 16px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }
    body.focusing header { opacity: 0; }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      color: var(--paper-100);
      text-shadow: 0 4px 30px rgba(0,0,0,0.9);
    }
    header p {
      margin-top: 9px;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      color: var(--paper-300);
      opacity: 0.6;
    }

    /* 3D Gallery cloud */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      perspective: var(--perspective);
      perspective-origin: 50% 50%;
      overflow: hidden;
      cursor: grab;
    }
    .scene:active { cursor: grabbing; }

    .cloud {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 16px 46px rgba(0,0,0,0.6);
      cursor: pointer;
      will-change: transform, opacity, filter;
      transform-origin: center;
      backface-visibility: hidden;
      transition: box-shadow 0.4s ease;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 58%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-label {
      position: absolute;
      bottom: 9px;
      left: 11px;
      z-index: 2;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      opacity: 0;
      transform: translateY(7px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    .card.hovered .card-label { opacity: 1; transform: translateY(0); }
    body.show-labels .card-label { opacity: 0.9; transform: none; }

    .card.focused {
      box-shadow: 0 0 0 1px rgba(245,240,230,0.10),
                  0 50px 130px rgba(0,0,0,0.8),
                  0 0 150px rgba(245,240,230,0.10);
    }

    .drag-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--paper-300);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }
    .drag-hint.show { opacity: 0.5; }

    /* Detail / focus panel (Scroll Mask reveal) */
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }
    .detail-overlay.active { pointer-events: auto; }

    .detail-panel {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 44px 24px 48px;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 26%, rgba(0,0,0,0.92) 100%);
      transform: translateY(40px);
      opacity: 0;
      clip-path: inset(0 46% 100% 46% round 16px);
      transition: transform 0.75s cubic-bezier(0.22,1,0.36,1),
                  opacity 0.6s ease,
                  clip-path 0.85s cubic-bezier(0.22,1,0.36,1);
    }
    .detail-overlay.active .detail-panel {
      transform: translateY(0);
      opacity: 1;
      clip-path: inset(0 0 0 0 round 0);
    }

    .detail-content { max-width: 720px; margin: 0 auto; position: relative; }

    .detail-content::before {
      content: attr(data-char);
      position: absolute;
      top: -84px;
      right: -4px;
      font-size: 7rem;
      font-weight: 700;
      color: rgba(245, 240, 230, 0.045);
      line-height: 1;
      pointer-events: none;
    }

    .detail-pinyin {
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      color: var(--gold);
      margin-bottom: 7px;
    }
    .detail-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      margin-bottom: 16px;
    }
    .detail-tag {
      display: inline-block;
      padding: 7px 16px;
      border: 1px solid var(--seal);
      color: var(--seal-light);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      margin-bottom: 22px;
      border-radius: 2px;
    }
    .detail-desc {
      font-size: 1rem;
      line-height: 2.05;
      color: var(--paper-200);
      letter-spacing: 0.04em;
    }

    .close-btn {
      position: absolute;
      top: -64px;
      right: 4px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(245, 240, 230, 0.18);
      background: rgba(10, 9, 8, 0.55);
      color: var(--paper-100);
      font-size: 1.5rem;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .close-btn:active { background: rgba(35, 30, 25, 0.85); }

    /* Cinematic intro */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.4s ease;
    }
    .intro.done { opacity: 0; pointer-events: none; }

    .intro-glyph {
      position: absolute;
      font-size: clamp(2.4rem, 9vw, 5.5rem);
      font-weight: 600;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      color: var(--paper-100);
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.22,1,0.36,1);
      text-shadow: 0 0 40px rgba(245,240,230,0.12);
    }
    .intro-glyph.show { opacity: 1; transform: translateY(0) scale(1); }

    .intro-skip {
      position: absolute;
      bottom: 42px; left: 50%;
      transform: translateX(-50%);
      padding: 9px 26px;
      background: transparent;
      border: 1px solid rgba(245,240,230,0.22);
      color: var(--paper-300);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.4s ease, border-color 0.4s ease;
    }
    .intro-skip:hover { color: var(--paper-100); border-color: rgba(245,240,230,0.5); }

    @media (min-width: 768px) {
      :root { --perspective: 1700px; }
      header { padding-top: 38px; }
      header h1 { font-size: 2.8rem; }
      header p { font-size: 0.84rem; }
      .detail-content { padding: 0 22px; }
      .detail-content::before { font-size: 10rem; top: -108px; }
      .detail-title { font-size: 3rem; }
      .detail-desc { font-size: 1.08rem; }
    }
  </style>
</head>
<body>
  <div class="stage-bg"></div>

  <header>
    <h1>字造集</h1>
    <p>汉字构形美学 · 六书情绪画廊</p>
  </header>

  <main class="scene" id="scene">
    <div class="cloud" id="cloud"></div>
  </main>

  <div class="drag-hint" id="dragHint">拖动漫游 · 双指缩放 · 点击聚焦</div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-panel" id="detailPanel">
      <button class="close-btn" id="closeBtn" aria-label="关闭">×</button>
      <div class="detail-content" id="detailContent"></div>
    </div>
  </div>

  <div class="intro" id="intro">
    <span class="intro-glyph">看见境</span>
    <span class="intro-glyph">感受意</span>
    <span class="intro-glyph">游字</span>
    <span class="intro-glyph">触字</span>
    <span class="intro-glyph">入字</span>
    <button class="intro-skip" id="introSkip">进入</button>
  </div>

  <script>
    const items = [
      { file: 'anxin.png',    title: '安心', pinyin: 'ān xīn',   tag: '会意 · 象形', desc: '“安”从女在宀下，屋下有女则安定，会意也；“心”象形，象心脏之形。屋宇庇护，女子安然，心得其所，是为安心。' },
      { file: 'benshang.png', title: '悲伤', pinyin: 'bēi shāng', tag: '形声',       desc: '“悲”从心，非声，非本有违背、哀痛之意；“伤”从人，省声。非声入心，痛彻肝肠；人逢离别，悲从中来。' },
      { file: 'fennu.png',    title: '愤怒', pinyin: 'fèn nù',    tag: '形声',       desc: '“愤”从心，贲声，气满胸臆；“怒”从心，奴声，心被压制而爆发。贲声激越，奴心难抑；怒火中烧，势不可遏。' },
      { file: 'gudu.png',     title: '孤独', pinyin: 'gū dú',     tag: '形声',       desc: '“孤”从子，瓜声，幼而无父曰孤；“独”从犬，蜀声，一犬独行。孑然一身，瓜声如叹；独对长空，形影相吊。' },
      { file: 'kongju.png',   title: '恐惧', pinyin: 'kǒng jù',   tag: '形声',       desc: '“恐”从心，巩声，心有畏巩；“惧”从心，瞿声，瞿然惊视。巩声颤心，瞿目四顾；幽林孤灯，惧由心生。' },
      { file: 'qidai.png',    title: '期待', pinyin: 'qī dài',    tag: '形声',       desc: '“期”从月，其声，月满为期；“待”从彳，寺声，止而等候。月满其期，伫立以待；晨光初露，希望在前。' },
      { file: 'xiyue.png',    title: '喜悦', pinyin: 'xǐ yuè',    tag: '会意 · 形声', desc: '“喜”从壴从口，鼓乐欢庆，会意也；“悦”从心，兑声。鼓乐张口，喜上眉梢；心悦神畅，如沐春风。' },
      { file: 'zhenfen.png',  title: '振奋', pinyin: 'zhèn fèn',  tag: '形声 · 会意', desc: '“振”从手，辰声，振衣而起；“奋”从奞在田上，鸟奋翼欲飞。振衣云端，奋翼九霄；红旗猎猎，意气风发。' }
    ];

    const cloud = document.getElementById('cloud');
    const scene = document.getElementById('scene');
    const dragHint = document.getElementById('dragHint');
    const detailOverlay = document.getElementById('detailOverlay');
    const detailPanel = document.getElementById('detailPanel');
    const detailContent = document.getElementById('detailContent');
    const closeBtn = document.getElementById('closeBtn');
    const intro = document.getElementById('intro');
    const introSkip = document.getElementById('introSkip');

    const PERSPECTIVE = 1500;
    const COPIES_PER_ITEM = 9;          // 8 images × 9 = 72 floating nodes
    const AUTO_SPEED = 0.16;            // gentle ambient drift when fully idle
    const INERTIA_DECAY = 0.93;         // slow deceleration after release
    const PARALLAX_AMT = 80;            // mouse parallax travel (px of camera)
    const FOCUS_NEAR = 540;             // Z the focused card travels toward the viewer
    const HOVER_SCALE = 0.14;

    let cards = [];
    let camera = { x: 0, y: 0 };
    let targetCamera = { x: 0, y: 0 };
    let velX = 0, velY = 0;             // inertia velocity
    let isDragging = false;
    let lastPointer = { x: 0, y: 0 };
    let dragDistance = 0;
    let hintShown = false;

    // Pinch / multi-touch
    const pointers = new Map();
    let isPinching = false;
    let pinchPrevDist = 0;
    let pinchPrevMid = { x: 0, y: 0 };
    let viewScale = 1;
    let targetViewScale = 1;

    // Mouse parallax
    let parX = 0, parY = 0;
    let parTX = 0, parTY = 0;

    // Focus
    let focusedCard = null;

    const t0 = performance.now();

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const midOf = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const depthFactor = (z) => PERSPECTIVE / (PERSPECTIVE - z);

    function init() {
      createCards();
      bindEvents();
      startIntro();
      requestAnimationFrame(animate);
    }

    function createCards() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Four depth bands → small/medium/large scattered nodes (not grid, not masonry)
      const bands = [
        { count: 1, zMin: 140,  zMax: 250,  sizeMin: 165, sizeMax: 220 },
        { count: 2, zMin: -210, zMax: -30,  sizeMin: 112, sizeMax: 172 },
        { count: 2, zMin: -580, zMax: -300, sizeMin: 70,  sizeMax: 116 },
        { count: 4, zMin: -1090,zMax: -720, sizeMin: 40,  sizeMax: 76  }
      ];

      const spreadX = vw * 2.7;
      const spreadY = vh * 2.05;

      items.forEach((item) => {
        bands.forEach((band) => {
          for (let i = 0; i < band.count; i++) {
            let x, y;
            if (band.zMin > 0) {
              // keep the few large near cards from overlapping
              let tries = 0;
              do {
                x = (Math.random() * 2 - 1) * spreadX * 0.7;
                y = (Math.random() * 2 - 1) * spreadY * 0.7;
                tries++;
              } while (tries < 12 && cards.some(c => c.z > 0 && Math.hypot(c.x - x, c.y - y) < 360));
            } else {
              x = (Math.random() * 2 - 1) * spreadX;
              y = (Math.random() * 2 - 1) * spreadY;
            }

            const z = band.zMin + Math.random() * (band.zMax - band.zMin);
            const size = band.sizeMin + Math.random() * (band.sizeMax - band.sizeMin);
            const w = size;
            const h = size / 0.75;

            const el = document.createElement('div');
            el.className = 'card';
            el.style.width = w + 'px';
            el.style.height = h + 'px';
            el.style.marginLeft = (w / -2) + 'px';
            el.style.marginTop = (h / -2) + 'px';
            el.innerHTML = `
              <img src="${item.file}" alt="${item.title}" loading="lazy" draggable="false">
              <div class="card-label">${item.title}</div>
            `;

            const labelEl = el.querySelector('.card-label');
            const cardObj = {
              el, labelEl,
              x, y, z,
              itemIndex: items.indexOf(item),
              rot: (Math.random() - 0.5) * 9,
              phase: Math.random() * Math.PI * 2,
              bobAmp: 3 + Math.random() * 4,
              rotAmp: 1 + Math.random() * 1.5,
              hovered: false,
              hoverT: 0,
              focusActive: false,
              focusAnimT: 0,
              exiting: false,
              baseW: w, baseH: h
            };

            el.addEventListener('click', () => {
              if (dragDistance > 12) return;
              enterFocus(cardObj);
            });
            el.addEventListener('mouseenter', () => { if (!focusedCard) cardObj.hovered = true; });
            el.addEventListener('mouseleave', () => { cardObj.hovered = false; });

            cloud.appendChild(el);
            cards.push(cardObj);
          }
        });
      });

      if (!window.matchMedia('(hover: hover)').matches) {
        document.body.classList.add('show-labels');
      }
    }

    function bindEvents() {
      scene.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);

      window.addEventListener('resize', () => {
        const vw = window.innerWidth, vh = window.innerHeight;
        cards.forEach(card => {
          if (Math.abs(card.x) > vw * 4) card.x *= 0.5;
          if (Math.abs(card.y) > vh * 3) card.y *= 0.5;
        });
      });

      closeBtn.addEventListener('click', (e) => { e.stopPropagation(); exitFocus(); });
      detailOverlay.addEventListener('click', (e) => {
        if (e.target === detailOverlay || e.target === detailPanel) exitFocus();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && focusedCard) exitFocus();
      });
    }

    function onPointerDown(e) {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        isDragging = true;
        dragDistance = 0;
        lastPointer.x = e.clientX;
        lastPointer.y = e.clientY;
        velX = 0; velY = 0;
        scene.setPointerCapture?.(e.pointerId);
        showHint();
      } else if (pointers.size === 2) {
        isDragging = false;
        isPinching = true;
        const pts = [...pointers.values()];
        pinchPrevDist = dist(pts[0], pts[1]);
        pinchPrevMid = midOf(pts[0], pts[1]);
        velX = 0; velY = 0;
        showHint();
      }
    }

    function onPointerMove(e) {
      // Mouse parallax (subtle camera offset following pointer)
      const vw = window.innerWidth, vh = window.innerHeight;
      parTX = -(e.clientX / vw - 0.5) * PARALLAX_AMT;
      parTY = -(e.clientY / vh - 0.5) * PARALLAX_AMT;

      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (isPinching && pointers.size >= 2) {
        e.preventDefault();
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        const m = midOf(pts[0], pts[1]);

        if (pinchPrevDist > 0) {
          targetViewScale = clamp(targetViewScale * (d / pinchPrevDist), 0.45, 3.2);
        }
        const mdx = m.x - pinchPrevMid.x;
        const mdy = m.y - pinchPrevMid.y;
        targetCamera.x -= mdx / viewScale;
        targetCamera.y -= mdy / viewScale;
        dragDistance += Math.hypot(mdx, mdy);

        pinchPrevDist = d;
        pinchPrevMid = m;
        return;
      }

      if (isDragging) {
        e.preventDefault();
        const dx = e.clientX - lastPointer.x;
        const dy = e.clientY - lastPointer.y;
        lastPointer.x = e.clientX;
        lastPointer.y = e.clientY;
        dragDistance += Math.sqrt(dx * dx + dy * dy);

        const rx = -dx * 1.1;
        const ry = -dy * 1.1;
        targetCamera.x += rx;
        targetCamera.y += ry;
        velX = rx; velY = ry;   // remember last move for inertia
      }
    }

    function onPointerUp(e) {
      pointers.delete(e.pointerId);

      if (pointers.size < 2) {
        isPinching = false;
        pinchPrevDist = 0;
      }

      if (pointers.size === 0) {
        isDragging = false;
      } else if (pointers.size === 1) {
        const [p] = [...pointers.values()];
        lastPointer.x = p.x;
        lastPointer.y = p.y;
        isDragging = true;
        dragDistance = 999;
        velX = 0; velY = 0;
      }
    }

    function showHint() {
      if (hintShown) return;
      hintShown = true;
      dragHint.classList.add('show');
      setTimeout(() => dragHint.classList.remove('show'), 4200);
    }

    function enterFocus(card) {
      pointers.clear();
      isPinching = false;
      isDragging = false;
      pinchPrevDist = 0;
      dragDistance = 999;
      velX = 0; velY = 0;

      if (focusedCard && focusedCard !== card) {
        focusedCard.exiting = true;
        focusedCard.el.classList.remove('focused');
      }

      focusedCard = card;
      card.hovered = false;
      card.el.classList.remove('hovered');
      card.focusActive = true;
      card.exiting = false;
      card.focusAnimT = 0;
      card.el.classList.add('focused');
      document.body.classList.add('focusing');

      const item = items[card.itemIndex];
      detailContent.setAttribute('data-char', item.title[0]);
      detailContent.innerHTML = `
        <div class="detail-pinyin">${item.pinyin}</div>
        <h2 class="detail-title">${item.title}</h2>
        <div class="detail-tag">${item.tag}</div>
        <p class="detail-desc">${item.desc}</p>
      `;
      detailOverlay.classList.add('active');
    }

    function exitFocus() {
      if (!focusedCard) return;
      focusedCard.exiting = true;
      focusedCard.el.classList.remove('focused');
      detailOverlay.classList.remove('active');
      document.body.classList.remove('focusing');
      velX = 0; velY = 0;
      focusedCard = null;
    }

    function updateCards(time) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const wrapX = vw * 4.4 * viewScale;
      const wrapY = vh * 3.4 * viewScale;

      const nearF = depthFactor(FOCUS_NEAR);
      const farF = depthFactor(-1090);
      const focusing = !!focusedCard;

      cards.forEach(card => {
        const f = depthFactor(card.z);
        const depthNorm = Math.max(0, Math.min(1, (f - farF) / (nearF - farF)));

        // ---- Focused card: travel along Z toward viewer + center ----
        if (card.focusActive) {
          const goal = card.exiting ? 0 : 1;
          card.focusAnimT += (goal - card.focusAnimT) * 0.11;

          if (card.exiting && card.focusAnimT < 0.02) {
            card.focusAnimT = 0;
            card.focusActive = false;
            card.exiting = false;
            card.el.style.zIndex = Math.round(1000 + card.z);
            return;
          }

          const t = card.focusAnimT;
          const basePx = (card.x - camera.x - parX) * f * viewScale;
          const basePy = (card.y - camera.y - parY) * f * viewScale;
          const baseScale = f * viewScale * (1 + 0.16 * depthNorm);
          const focusScale = nearF * viewScale * 1.12;
          const px = basePx * (1 - t);
          const py = basePy * (1 - t);
          const scale = baseScale + (focusScale - baseScale) * t;
          const zEff = card.z + (FOCUS_NEAR - card.z) * t;

          card.el.style.transform = `translate3d(${px}px, ${py}px, ${zEff}px) scale(${scale}) rotate(${card.rot * (1 - t)}deg)`;
          card.el.style.opacity = 1;
          card.el.style.filter = `blur(${7 * (1 - depthNorm) * (1 - t)}px) brightness(${0.5 + 0.5 * t})`;
          card.el.style.zIndex = 3000;
          return;
        }

        // ---- Normal cards: organic float, infinite wrap, depth falloff ----
        const bob = Math.sin(time * 0.0006 + card.phase) * card.bobAmp;
        const rotWobble = Math.sin(time * 0.0004 + card.phase) * card.rotAmp;

        let px = (card.x - camera.x) * f * viewScale;
        let py = (card.y - camera.y) * f * viewScale + bob * f * viewScale;

        if (px < -vw * 2.0) card.x += wrapX;
        else if (px > vw * 2.0) card.x -= wrapX;
        if (py < -vh * 1.6) card.y += wrapY;
        else if (py > vh * 1.6) card.y -= wrapY;

        px = (card.x - camera.x) * f * viewScale;
        py = (card.y - camera.y) * f * viewScale + bob * f * viewScale;

        // Mouse parallax (depth-weighted: near shifts more)
        px -= parX * f * viewScale;
        py -= parY * f * viewScale;

        // Hover ease
        card.hoverT += ((card.hovered ? 1 : 0) - card.hoverT) * 0.18;
        const hov = card.hoverT;

        let opacity = 0.1 + 0.9 * Math.pow(depthNorm, 0.6);
        let blur = (1 - depthNorm) * 7;
        let brightness = 0.3 + 0.7 * depthNorm;
        let scale = f * viewScale * (1 + 0.16 * depthNorm);

        scale *= 1 + HOVER_SCALE * hov;
        brightness += 0.22 * hov;
        opacity = Math.min(1, opacity + 0.08 * hov);

        // Surrounding cards stay as soft depth-of-field background during focus
        if (focusing) {
          opacity = opacity * 0.5 + 0.05;
          blur += 3.2;
          brightness *= 0.72;
        }

        card.el.style.transform = `translate3d(${px}px, ${py}px, ${card.z}px) scale(${scale}) rotate(${card.rot + rotWobble}deg)`;
        card.el.style.opacity = opacity;
        card.el.style.filter = `blur(${blur}px) brightness(${brightness})`;
        card.el.style.zIndex = Math.round(1000 + card.z + (hov > 0.3 ? 600 : 0));

        if (hov > 0.05) card.el.classList.add('hovered');
        else card.el.classList.remove('hovered');
      });
    }

    function animate() {
      const now = performance.now();
      const time = now - t0;
      const focusing = !!focusedCard;

      if (!isDragging && !isPinching && !focusing) {
        // Inertia with slow deceleration, then gentle ambient drift
        if (Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02) {
          targetCamera.x += velX;
          targetCamera.y += velY;
          velX *= INERTIA_DECAY;
          velY *= INERTIA_DECAY;
        } else {
          velX = 0; velY = 0;
          targetCamera.x += AUTO_SPEED;
        }
      }

      // Parallax eases to pointer-derived target, frozen during drag/pinch/focus
      const ptx = (isDragging || isPinching || focusing) ? 0 : parTX;
      const pty = (isDragging || isPinching || focusing) ? 0 : parTY;
      parX += (ptx - parX) * 0.06;
      parY += (pty - parY) * 0.06;

      camera.x += (targetCamera.x - camera.x) * 0.08;
      camera.y += (targetCamera.y - camera.y) * 0.08;
      viewScale += (targetViewScale - viewScale) * 0.15;

      updateCards(time);
      requestAnimationFrame(animate);
    }

    // ---- Cinematic intro: 看见境 → 感受意 → 游字 → 触字 → 入字 ----
    function startIntro() {
      const glyphs = [...intro.querySelectorAll('.intro-glyph')];
      let idx = 0;
      let timer = null;

      function step() {
        if (idx > 0) glyphs[idx - 1].classList.remove('show');
        if (idx < glyphs.length) {
          glyphs[idx].classList.add('show');
          idx++;
          timer = setTimeout(step, 1150);
        } else {
          timer = setTimeout(endIntro, 950);
        }
      }

      function endIntro() {
        clearTimeout(timer);
        intro.classList.add('done');
        showHint();
        setTimeout(() => { intro.style.display = 'none'; }, 1500);
      }

      introSkip.addEventListener('click', endIntro);
      timer = setTimeout(step, 600);
    }

    init();
  </script>
</body>
</html>
