<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>字造集 · 汉字演变高速路</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold:#e8b04b; --gold-soft:#f3d29a; --ink:#0c0c0e;
    --vermilion:#c8402f; --cyan:#03b3c3; --magenta:#d856bf;
    --paper:rgba(14,14,18,0.55); --line:rgba(232,176,75,0.28);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:#000; color:#fff;
    overflow:hidden; font-family:"Noto Serif SC","Songti SC","STSong",serif; -webkit-font-smoothing:antialiased; }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }
  #grain{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,0.55) 100%); mix-blend-mode:multiply; }

  /* Loader */
  #loader{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 40%, #111319 0%, #000 70%); transition:opacity .8s ease; text-align:center; }
  #loader.hide{ opacity:0; pointer-events:none; }
  .brand-lg{ font-family:"Ma Shan Zheng",serif; font-size:clamp(48px,12vw,96px); color:var(--gold);
    letter-spacing:.12em; line-height:1; text-shadow:0 0 30px rgba(232,176,75,.35); }
  #loader .sub{ margin-top:14px; color:var(--gold-soft); font-size:clamp(14px,3.6vw,18px); letter-spacing:.35em; opacity:.85; }
  #enter{ margin-top:42px; padding:14px 46px; font-size:18px; letter-spacing:.3em; color:var(--ink);
    background:linear-gradient(180deg,var(--gold-soft),var(--gold)); border:none; border-radius:40px; cursor:pointer; font-family:inherit;
    box-shadow:0 0 0 1px rgba(232,176,75,.5), 0 10px 40px rgba(232,176,75,.25); transition:.25s; }
  #enter:hover{ transform:translateY(-2px); box-shadow:0 0 0 1px rgba(232,176,75,.7), 0 14px 50px rgba(232,176,75,.4); }
  #loader .hint{ margin-top:26px; color:#7a7a82; font-size:12px; letter-spacing:.2em; }
  #loader .err{ color:var(--vermilion); margin-top:18px; font-size:13px; }

  /* Overlay */
  #overlay{ position:fixed; inset:0; z-index:10; pointer-events:none; }
  #overlay > *{ pointer-events:auto; }
  header{ position:absolute; top:0; left:0; right:0; padding:max(18px,env(safe-area-inset-top)) 24px 18px;
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; background:linear-gradient(180deg, rgba(0,0,0,.55), transparent); }
  .brand{ font-family:"Ma Shan Zheng",serif; font-size:clamp(24px,4.5vw,34px); color:var(--gold); letter-spacing:.1em; text-shadow:0 0 18px rgba(232,176,75,.3); }
  .tag{ color:rgba(255,255,255,.65); font-size:clamp(11px,2.6vw,14px); letter-spacing:.22em; }

  .card{ position:absolute; right:max(28px,3vw); top:50%; transform:translateY(-50%); width:min(380px,33vw);
    background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px 26px 22px;
    backdrop-filter:blur(14px) saturate(120%); -webkit-backdrop-filter:blur(14px) saturate(120%); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .card::before{ content:""; position:absolute; left:0; top:22px; bottom:22px; width:3px;
    background:linear-gradient(180deg,transparent,var(--gold),transparent); border-radius:3px; }
  .art{ height:clamp(150px,20vh,210px); display:flex; align-items:center; justify-content:center; color:var(--gold); margin-bottom:10px; }
  .glyph-svg{ width:auto; height:100%; max-width:100%; filter:drop-shadow(0 0 16px rgba(232,176,75,.35)); }
  .hanzi{ font-family:"Ma Shan Zheng","Noto Serif SC",serif; line-height:1; }
  .hanzi.kai,.hanzi.jian{ font-size:clamp(120px,18vh,180px); color:var(--gold); text-shadow:0 0 22px rgba(232,176,75,.4); }
  .step{ font-size:12px; letter-spacing:.3em; color:var(--cyan); margin-bottom:6px; }
  .card h2{ margin:0; font-size:clamp(26px,4vw,34px); letter-spacing:.18em; color:#fff; font-weight:600; }
  .period{ margin-top:4px; font-size:13px; letter-spacing:.12em; color:var(--gold-soft); opacity:.85; }
  .card p{ margin:14px 0 0; font-size:15px; line-height:1.9; color:rgba(255,255,255,.82); letter-spacing:.04em; }

  .controls{ position:absolute; left:50%; bottom:max(26px,env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; align-items:center; gap:18px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.12);
    padding:10px 16px; border-radius:40px; backdrop-filter:blur(10px); }
  .controls button{ width:46px; height:46px; border-radius:50%; border:1px solid rgba(232,176,75,.4);
    background:rgba(232,176,75,.06); color:var(--gold); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:.2s; font-family:inherit; }
  .controls button:hover{ background:rgba(232,176,75,.18); transform:scale(1.06); }
  .controls #play{ font-size:14px; letter-spacing:.05em; }
  .dots{ position:absolute; left:50%; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 74px); transform:translateX(-50%); display:flex; gap:9px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.28); transition:.3s; cursor:pointer; }
  .dots i.on{ background:var(--gold); box-shadow:0 0 10px var(--gold); transform:scale(1.25); }
  .speedbar{ position:absolute; left:24px; bottom:max(26px,env(safe-area-inset-bottom)); width:120px; height:4px;
    background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; }
  .speedbar > i{ display:block; height:100%; width:30%; background:linear-gradient(90deg,var(--cyan),var(--magenta)); transition:width .2s; }

  @media (max-width:768px){
    header{ justify-content:center; text-align:center; padding-top:max(14px,env(safe-area-inset-top)); }
    .tag{ display:none; }
    .card{ right:12px; left:12px; width:auto; top:auto; bottom:118px; transform:none; padding:18px 18px 16px; }
    .card::before{ display:none; }
    .art{ height:120px; margin-bottom:6px; }
    .card p{ font-size:13.5px; line-height:1.75; margin-top:10px; }
    .card h2{ font-size:24px; }
    .controls{ bottom:max(18px,env(safe-area-inset-bottom)); }
    .dots{ bottom:calc(max(18px,env(safe-area-inset-bottom)) + 70px); }
    .speedbar{ display:none; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="grain"></div>

  <div id="overlay">
    <header>
      <div class="brand">字造集</div>
      <div class="tag">汉字演变 · 一条通向文明的高速路</div>
    </header>

    <section class="card" id="card">
      <div class="art" id="art"></div>
      <div class="meta">
        <div class="step" id="step"></div>
        <h2 id="name"></h2>
        <div class="period" id="period"></div>
        <p id="desc"></p>
      </div>
    </section>

    <div class="dots" id="dots"></div>

    <div class="controls">
      <button id="prev" aria-label="上一章">‹</button>
      <button id="play" aria-label="播放/暂停">❚❚</button>
      <button id="next" aria-label="下一章">›</button>
    </div>

    <div class="speedbar"><i id="speedfill"></i></div>
  </div>

  <div id="loader">
    <div class="loader-inner">
      <div class="brand-lg">字造集</div>
      <div class="sub">汉字演变 · 高速路</div>
      <button id="enter">进入高速路</button>
      <div class="hint">建议在安静环境中 · 横屏体验更佳</div>
      <div class="err" id="lerr"></div>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- config (from user's Hyperspeed options) ---------- */
const CFG = {
  roadWidth: 10, islandWidth: 2, lanesPerRoad: 4, length: 400,
  colors: {
    roadColor: 0x080808, islandColor: 0x0a0a0a, background: 0x000000,
    shoulderLines: 0xffffff, brokenLines: 0xffffff,
    leftCars: [0xd856bf, 0x6750a2, 0xc247ac],
    rightCars: [0x03b3c3, 0x0e5ea5, 0x324555],
    sticks: 0x03b3c3,
  }
};
const isMobile = window.matchMedia('(max-width:768px)').matches;
const PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
const CAR_COUNT   = isMobile ? 38 : 64;
const STICK_COUNT = isMobile ? 14 : 20;

/* road path (winding + hills) — MUST match GLSL below */
function pathX(p){ return 16*Math.sin(p*0.010) + 7*Math.sin(p*0.027+1.3); }
function pathY(p){ return 7*Math.sin(p*0.016+0.5) + 3*Math.sin(p*0.041); }
function yawOf(p){ const d=1.0; const dx=pathX(p+d)-pathX(p-d); return Math.atan2(dx, 2.0*d); }

/* layout of evolving milestones */
const STAGES = 6, SPACING = 80, LOOP = STAGES*SPACING; // 480
const GLYPH_BASE = 70;          // first milestone distance ahead
const FORWARD = 12;             // road forward speed (units/sec)

/* ---------- three globals ---------- */
let renderer, scene, camera, composer, clock;
let roadMat, cars = [], sticks = [], glyphs = [];
let uScroll = 0, speedBoost = 1, playing = true, raf = null;

/* ---------- road shader ---------- */
const VERT = `
  uniform float uTime; uniform float uScroll;
  varying vec2 vUv;
  float pathX(float p){ return 16.0*sin(p*0.010) + 7.0*sin(p*0.027+1.3); }
  float pathY(float p){ return 7.0*sin(p*0.016+0.5) + 3.0*sin(p*0.041); }
  float yawOf(float p){ float d=1.0; float dx=pathX(p+d)-pathX(p-d); return atan(dx, 2.0*d); }
  float turb(float x,float z,float t){
    return sin(x*0.4+t*0.8)*0.18 + sin(z*0.15+t*1.1)*0.14 + sin((x+z)*0.1+t*0.5)*0.08;
  }
  void main(){
    vUv = uv;
    float p = position.z - uScroll;
    float cx = pathX(p), cy = pathY(p), yw = yawOf(p);
    float ox = position.x;
    float rx = ox * cos(yw);
    float rz = ox * sin(yw);
    vec3 wp;
    wp.x = cx + rx;
    wp.z = position.z + rz;
    wp.y = cy + 0.25 + turb(position.x, position.z, uTime);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(wp, 1.0);
  }`;

const FRAG = `
  precision highp float;
  uniform vec3 uRoad; uniform vec3 uIsland; uniform vec3 uLine; uniform float uWidth;
  varying vec2 vUv;
  float edge(float x, float cx, float hw){ return 1.0 - smoothstep(hw*0.4, hw, abs(x-cx)); }
  void main(){
    float x = (vUv.x - 0.5) * uWidth;
    float onLeft  = step(-11.0, x) * step(x, -1.0);
    float onRight = step(  1.0, x) * step(x, 11.0);
    float onRoad  = max(onLeft, onRight);
    float onIsland = step(-1.0, x) * step(x, 1.0);
    if(onRoad < 0.5 && onIsland < 0.5) discard;
    vec3 col;
    if(onIsland > 0.5){
      col = uIsland;
    } else {
      float line = 0.0;
      line = max(line, edge(x, 11.0, 0.25));
      line = max(line, edge(x,-11.0, 0.25));
      line = max(line, edge(x,  1.0, 0.25));
      line = max(line, edge(x, -1.0, 0.25));
      float coord = vUv.y * 50.0 - uScroll;
      float dash = step(fract(coord), 0.5);
      line = max(line, dash * edge(x, -3.5, 0.5));
      line = max(line, dash * edge(x, -6.0, 0.5));
      line = max(line, dash * edge(x, -8.5, 0.5));
      line = max(line, dash * edge(x,  3.5, 0.5));
      line = max(line, dash * edge(x,  6.0, 0.5));
      line = max(line, dash * edge(x,  8.5, 0.5));
      col = uRoad + uLine * line * 1.8 + uRoad * 0.25;
    }
    gl_FragColor = vec4(col, 1.0);
  }`;

/* ---------- glyph textures (gold, with stage name) ---------- */
const GOLD = '#e8b04b';
function wrapSVG(inner){ return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><g fill="none" stroke="${GOLD}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`; }
const SVG_TEX = {
  jia: wrapSVG(`<circle cx="38" cy="82" r="15"/><circle cx="82" cy="82" r="15"/><line x1="38" y1="82" x2="82" y2="82"/><line x1="38" y1="82" x2="38" y2="55"/><line x1="82" y1="82" x2="82" y2="55"/><line x1="38" y1="55" x2="82" y2="55"/><line x1="60" y1="55" x2="60" y2="22"/><path d="M46 22 Q60 12 74 22"/>`),
  jin: wrapSVG(`<circle cx="40" cy="80" r="16"/><circle cx="80" cy="80" r="16"/><line x1="40" y1="80" x2="80" y2="80"/><path d="M40 64 Q60 50 80 64"/><line x1="60" y1="64" x2="60" y2="30"/><path d="M48 30 Q60 22 72 30"/><line x1="40" y1="80" x2="40" y2="96"/><line x1="80" y1="80" x2="80" y2="96"/>`),
  zhuan: wrapSVG(`<line x1="35" y1="22" x2="85" y2="22"/><line x1="35" y1="100" x2="85" y2="100"/><line x1="60" y1="12" x2="60" y2="110"/><circle cx="47" cy="62" r="14"/><circle cx="73" cy="62" r="14"/>`),
  li: wrapSVG(`<line x1="30" y1="26" x2="90" y2="26"/><line x1="30" y1="96" x2="90" y2="96"/><line x1="60" y1="12" x2="60" y2="110"/><rect x="36" y="50" width="18" height="22"/><rect x="66" y="50" width="18" height="22"/><line x1="30" y1="61" x2="90" y2="61"/>`),
};
const STAGE_GLYPH = [
  { svg: SVG_TEX.jia,   name:'甲骨文' },
  { svg: SVG_TEX.jin,   name:'金文' },
  { svg: SVG_TEX.zhuan, name:'小篆' },
  { svg: SVG_TEX.li,    name:'隶书' },
  { char:'車',          name:'楷书' },
  { char:'车',          name:'简体' },
];

function svgToImage(svg){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function makeGlyphTexture(spec){
  const c = document.createElement('canvas'); c.width = 320; c.height = 400;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,320,400);
  if(spec.svg){
    const img = await svgToImage(spec.svg);
    ctx.drawImage(img, 40, 30, 240, 240);
  } else {
    ctx.fillStyle = GOLD;
    ctx.font = '210px "Ma Shan Zheng","Noto Serif SC",serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(spec.char, 160, 175);
  }
  ctx.fillStyle = GOLD;
  ctx.font = '40px "Noto Serif SC",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(spec.name, 160, 350);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ---------- init ---------- */
async function initThree(){
  await document.fonts.ready;
  const canvas = document.getElementById('scene');
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(PIXEL_RATIO);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CFG.colors.background);
  scene.fog = new THREE.Fog(CFG.colors.background, 30, 260);

  camera = new THREE.PerspectiveCamera(90, window.innerWidth/window.innerHeight, 0.1, 800);
  camera.position.set(0, 3, 10);
  camera.lookAt(0, 1.4, -80);

  // road (centered at origin; curve/hills computed in vertex shader)
  const geo = new THREE.PlaneGeometry(26, CFG.length, 24, 400);
  geo.rotateX(-Math.PI/2);
  roadMat = new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0}, uScroll:{value:0}, uWidth:{value:26},
      uRoad:{value:new THREE.Color(CFG.colors.roadColor)},
      uIsland:{value:new THREE.Color(CFG.colors.islandColor)},
      uLine:{value:new THREE.Color(CFG.colors.shoulderLines)},
    },
    vertexShader:VERT, fragmentShader:FRAG, side:THREE.DoubleSide
  });
  scene.add(new THREE.Mesh(geo, roadMat));

  buildSticks();
  buildCars();
  await buildGlyphs();

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    isMobile ? 0.95 : 1.25, 0.55, 0.0));
  composer.addPass(new OutputPass());

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

function buildSticks(){
  const n = STICK_COUNT, spacing = LOOP / n;
  for(const side of [-1, 1]){
    for(let i=0;i<n;i++){
      const h = 1.3 + Math.random()*0.4;
      const s = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, h, 0.18),
        new THREE.MeshBasicMaterial({ color:CFG.colors.sticks }));
      s.userData = { p: i*spacing + Math.random()*spacing*0.6, ox: side*12 };
      scene.add(s); sticks.push(s);
    }
  }
}

function buildCars(){
  const pal = { left:CFG.colors.leftCars, right:CFG.colors.rightCars };
  const laneW = CFG.roadWidth / CFG.lanesPerRoad;
  for(let i=0;i<CAR_COUNT;i++){
    const side = Math.random()<0.5 ? -1 : 1;
    const lane = Math.floor(Math.random()*CFG.lanesPerRoad);
    const ox = side*(CFG.islandWidth/2 + laneW/2 + lane*laneW) + (Math.random()*2-1)*0.8;
    const len = 6 + Math.random()*28;
    const c = new THREE.Mesh(
      new THREE.BoxGeometry(1.0, 0.35, len),
      new THREE.MeshBasicMaterial({ color: pal[side<0?'left':'right'][Math.floor(Math.random()*3)] }));
    c.userData = { p: Math.random()*LOOP, ox, v: -4 + Math.random()*20 };
    scene.add(c); cars.push(c);
  }
}

async function buildGlyphs(){
  for(let i=0;i<STAGES;i++){
    const tex = await makeGlyphTexture(STAGE_GLYPH[i]);
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:true });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(13, 16, 1);
    sp.userData = { p: GLYPH_BASE + i*SPACING };
    scene.add(sp); glyphs.push(sp);
  }
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

function placeOnPath(obj, p, yOff){
  let z = p + uScroll;
  while(z > 30){ p -= LOOP; z = p + uScroll; }
  obj.userData.p = p;
  const yw = yawOf(p);
  obj.position.set(pathX(p) + obj.userData.ox*Math.cos(yw), pathY(p) + yOff, z);
  return z;
}

function animate(){
  raf = requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  speedBoost += (1 - speedBoost) * Math.min(dt*2, 1);
  if(playing) uScroll += FORWARD * dt * speedBoost;

  roadMat.uniforms.uTime.value += dt;
  roadMat.uniforms.uScroll.value = uScroll;

  for(const c of cars){
    c.userData.p += c.userData.v * dt * speedBoost;
    const z = placeOnPath(c, c.userData.p, 0.4);
    c.rotation.y = -yawOf(c.userData.p);
    if(z < -200) c.visible = false; else c.visible = true;
  }
  for(const s of sticks){
    const z = placeOnPath(s, s.userData.p, s.geometry.parameters.height/2);
    if(z < -200) s.visible = false; else s.visible = true;
  }
  for(const g of glyphs){
    const z = placeOnPath(g, g.userData.p, 7.5);
    g.visible = z > -200;
  }

  // camera rides the winding, hilly road
  const pCam = 10 - uScroll;
  camera.position.set(pathX(pCam), pathY(pCam) + 3.0, 10);
  const pAhead = -70 - uScroll;
  camera.lookAt(pathX(pAhead), pathY(pAhead) + 1.0, -70);

  const targetFov = 90 + (speedBoost - 1) * 55;
  camera.fov += (targetFov - camera.fov) * Math.min(dt*3, 1);
  camera.updateProjectionMatrix();

  const sf = document.getElementById('speedfill');
  if(sf) sf.style.width = (22 + speedBoost*55) + '%';

  // sync side card to the milestone nearest the camera
  let nearest = idx, nd = 1e9;
  for(let i=0;i<glyphs.length;i++){
    const d = Math.abs(glyphs[i].position.z - 10);
    if(d < nd){ nd = d; nearest = i; }
  }
  if(nearest !== idx){ idx = nearest; render(); }

  composer.render();
}

/* ============== 汉字演变内容（侧栏卡片） ============== */
const SVG = {

  jin: `<svg class="glyph-svg" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <circle cx="40" cy="80" r="16"/><circle cx="80" cy="80" r="16"/>
    <line x1="40" y1="80" x2="80" y2="80"/><path d="M40 64 Q60 50 80 64"/>
    <line x1="60" y1="64" x2="60" y2="30"/><path d="M48 30 Q60 22 72 30"/>
    <line x1="40" y1="80" x2="40" y2="96"/><line x1="80" y1="80" x2="80" y2="96"/></g></svg>`,
  zhuan: `<svg class="glyph-svg" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <line x1="35" y1="22" x2="85" y2="22"/><line x1="35" y1="100" x2="85" y2="100"/>

  li: `<svg class="glyph-svg" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <line x1="30" y1="26" x2="90" y2="26"/><line x1="30" y1="96" x2="90" y2="96"/>
    <line x1="60" y1="12" x2="60" y2="110"/><rect x="36" y="50" width="18" height="22"/><rect x="66" y="50" width="18" height="22"/>
    <line x1="30" y1="61" x2="90" y2="61"/></g></svg>`,
};
const ERAS = [
  { name:'甲骨文', period:'商代 · 约公元前1250年', art: SVG.jia,  desc:'象形字。画一辆战车：双轮、车轴、车厢与辕。汉字最初是「画」出来的。' },
  { name:'金文',   period:'西周 · 约公元前1000年', art: SVG.jin,  desc:'铸刻于青铜器。线条圆润肥厚，战车形象渐趋规整对称。' },
  { name:'小篆',   period:'秦 · 公元前221年',      art: SVG.zhuan,desc:'书同文。车写作「車」，结构对称、笔画圆转，象形渐隐、符号渐强。' },
  { name:'隶书',   period:'汉 · 约公元前200年',    art: SVG.li,   desc:'化圆为方，横平竖直，「車」趋于扁平，奠定方块字格局。' },
  { name:'楷书',   period:'魏晋至今',              art:'<div class="hanzi kai">車</div>',   desc:'形体定型，「車」笔画规范，成为通行正字。' },
  { name:'简体字', period:'1956年',                art:'<div class="hanzi jian">车</div>',  desc:'简化为「车」，保留车轮意象，书写更便捷。' },
];

let idx = 0;

function render(){
  const e = ERAS[idx];
  document.getElementById('art').innerHTML = e.art;
  document.getElementById('name').textContent = e.name;
  document.getElementById('period').textContent = e.period;
  document.getElementById('desc').textContent = e.desc;
  document.getElementById('step').textContent = String(idx+1).padStart(2,'0') + ' / ' + String(ERAS.length).padStart(2,'0');
  [...document.getElementById('dots').children].forEach((d,i)=> d.classList.toggle('on', i===idx));
}
function boost(){ speedBoost = 2.3; }

function gotoStage(i){
  // bring milestone i to the camera (z=10)
  uScroll = 10 - (GLYPH_BASE + i*SPACING);
  boost();
}
function next(){ gotoStage((idx+1) % STAGES); }
function prev(){ gotoStage((idx-1+STAGES) % STAGES); }
function togglePlay(){
  playing = !playing;
  document.getElementById('play').textContent = playing ? '❚❚' : '▶';
}

const dotsEl = document.getElementById('dots');
ERAS.forEach((_,i)=>{
  const d = document.createElement('i');
  d.addEventListener('click', ()=> gotoStage(i));
  dotsEl.appendChild(d);
});
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.getElementById('play').addEventListener('click', togglePlay);

/* ============== 启动 ============== */
const loader = document.getElementById('loader');
document.getElementById('enter').addEventListener('click', async ()=>{
  try{
    await initThree();
    render();
    loader.classList.add('hide');
    setTimeout(()=> loader.style.display='none', 850);
  }catch(err){
    console.error(err);
    document.getElementById('lerr').textContent = '当前环境不支持 WebGL，无法启动高速路。';
  }
}, { once:true });
</script>
</body>
</html>
