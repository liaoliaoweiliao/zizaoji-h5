<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>字造集 · 汉字情绪画廊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* 弘磊板书：叙事第 06 步古字汇聚成的那个「字」专用 */
    @font-face {
      font-family: "Honglei-Banshu";

           url("zizaoji4_final_xuanxuan_audio_button/zizaoji4_final_xuanxuan_audio_button/fonts/hongleibanshu.woff2") format("woff2");
      font-style: normal;
      font-weight: normal;
      font-display: block;
    }
    :root {
      --font-banshu: "Honglei-Banshu", "Songti SC", "STSong", "SimSun", serif;
      --ink-900: #000000;
      --paper-100: #f5f0e6;
      --paper-200: #e8e0d0;
      --paper-300: #9a9486;
      --seal: #a83f39;
      --seal-light: #c45c52;
      --gold: #b89b4a;
      --perspective: 1500px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink-900);
      color: var(--paper-100);
      font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
    }

    /* ===== Global ambient starfield (behind gallery & mood-select) ===== */
    #starCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ===== Gallery: pure black infinite void ===== */
    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 50% 46%, rgba(20, 18, 16, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.85) 100%),
        #000;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 26px 20px 16px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }
    body.focusing header { opacity: 0; }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      color: var(--paper-100);
      text-shadow: 0 4px 30px rgba(0,0,0,0.9);
    }
    header p {
      margin-top: 9px;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      color: var(--paper-300);
      opacity: 0.6;
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: 2;
      perspective: var(--perspective);
      perspective-origin: 50% 50%;
      overflow: hidden;
      cursor: grab;
    }
    .scene:active { cursor: grabbing; }

    .cloud {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 16px 46px rgba(0,0,0,0.6);
      cursor: pointer;
      will-change: transform, opacity, filter;
      transform-origin: center;
      backface-visibility: hidden;
      transition: box-shadow 0.4s ease;
      background: linear-gradient(135deg, #1a1814, #2a2620);
    }
    .card.img-missing img { display: none; }
    .card.img-missing::before {
      content: attr(data-title);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: rgba(245,240,230,0.5);
      letter-spacing: 0.2em;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 58%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card-label {
      position: absolute;
      bottom: 9px;
      left: 11px;
      z-index: 2;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      opacity: 0;
      transform: translateY(7px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }
    .card.hovered .card-label { opacity: 1; transform: translateY(0); }
    body.show-labels .card-label { opacity: 0.9; transform: none; }

    .card.focused {
      box-shadow: 0 0 0 1px rgba(245,240,230,0.10),
                  0 50px 130px rgba(0,0,0,0.8),
                  0 0 150px rgba(245,240,230,0.10);
    }

    .drag-hint {
      position: relative;
      z-index: 10;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      color: var(--paper-300);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      margin-top: 10px;
      text-shadow: 0 1px 10px rgba(0,0,0,0.35);
    }
    .drag-hint.show { opacity: 0.55; }

    /* Detail / focus panel (Scroll Mask reveal) */
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 4000;
      pointer-events: none;
    }
    .detail-overlay.active { pointer-events: auto; }

    /* 悲伤情绪卡片：细雨滴下落动效（细、长、透明，整体极淡） */
    .rain-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .rain-canvas.on { opacity: 1; }

    .detail-panel {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      padding: 44px 24px 48px;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 26%, rgba(0,0,0,0.92) 100%);
      transform: translateY(40px);
      opacity: 0;
      clip-path: inset(0 46% 100% 46% round 16px);
      transition: transform 0.75s cubic-bezier(0.22,1,0.36,1),
                  opacity 0.6s ease,
                  clip-path 0.85s cubic-bezier(0.22,1,0.36,1);
    }
    .detail-overlay.active .detail-panel {
      transform: translateY(0);
      opacity: 1;
      clip-path: inset(0 0 0 0 round 0);
    }

    .detail-content { max-width: 720px; margin: 0 auto; position: relative; }

    .detail-content::before {
      content: attr(data-char);
      position: absolute;
      top: -84px;
      right: -4px;
      font-size: 7rem;
      font-weight: 700;
      color: rgba(245, 240, 230, 0.045);
      line-height: 1;
      pointer-events: none;
    }

    .detail-pinyin {
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      color: var(--gold);
      margin-bottom: 7px;
    }
    .detail-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      margin-bottom: 16px;
    }
    .detail-tag {
      display: inline-block;
      padding: 7px 16px;
      border: 1px solid var(--seal);
      color: var(--seal-light);
      font-size: 0.74rem;
      letter-spacing: 0.12em;
      margin-bottom: 22px;
      border-radius: 2px;
    }
    .detail-desc {
      font-size: 1rem;
      line-height: 2.05;
      color: var(--paper-200);
      letter-spacing: 0.04em;
      margin-bottom: 26px;
    }

    .create-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 30px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
    }
    .create-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(201,168,86,0.25), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .create-btn:hover {
      color: var(--paper-100);
      background: rgba(184,155,74,0.12);
      box-shadow: 0 0 30px rgba(184,155,74,0.35);
    }
    .create-btn:hover::after { opacity: 1; }
    .create-btn .arrow { font-size: 1.1rem; }

    .close-btn {
      position: absolute;
      top: -64px;
      right: 4px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(245,240,230,0.18);
      background: rgba(10, 9, 8, 0.55);
      color: var(--paper-100);
      font-size: 1.5rem;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .close-btn:active { background: rgba(35, 30, 25, 0.85); }

    /* ===== Narrative (replaces the 5-glyph intro with a 6-step story) ===== */
    .narrative {
      position: fixed;
      inset: 0;
      z-index: 320;
      background: #000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.4s ease, visibility 1.4s ease;
      overflow: hidden;
      cursor: none;
    }
    .narrative.show { opacity: 1; visibility: visible; }
    .narrative.done { opacity: 0; visibility: hidden; pointer-events: none; }

    .narv-strobe {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 2.6s ease;
      pointer-events: none;
    }
    .narv-strobe.on { opacity: 0.13; }
    .narv-glyph {
      position: absolute;
      color: rgba(245, 240, 230, 0.5);
      font-weight: 700;
      text-shadow: 0 0 30px rgba(245, 240, 230, 0.15);
      animation: glyphFloat 16s ease-in-out infinite;
    }
    @keyframes glyphFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.45; }
      50% { transform: translateY(-14px) rotate(2deg); opacity: 0.9; }
    }

    .narv-lamp {
      position: absolute;
      left: 50%;
      bottom: 20%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, 50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,128,0.95) 0%, rgba(255,172,92,0.6) 35%, rgba(255,150,70,0) 70%);
      box-shadow: 0 0 18px 8px rgba(255,182,104,0.5);
      opacity: 0;
      z-index: 2;
    }
    .narv-lamp.on {
      opacity: 1;
      animation: lampBreathe 2.8s ease-in-out infinite;
    }
    .narv-lamp.on::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 42vmax; height: 42vmax;
      transform: translate(-50%, -32%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,182,104,0.16) 0%, rgba(255,160,80,0.05) 30%, transparent 62%);
      pointer-events: none;
      animation: lampSpread 4.4s ease-out forwards;
    }
    @keyframes lampBreathe {
      0%, 100% { filter: brightness(1); box-shadow: 0 0 18px 8px rgba(255,182,104,0.5); }
      50% { filter: brightness(1.14); box-shadow: 0 0 30px 13px rgba(255,190,120,0.66); }
    }
    @keyframes lampSpread {
      0% { opacity: 0; transform: translate(-50%, -32%) scale(0.2); }
      100% { opacity: 1; transform: translate(-50%, -32%) scale(1); }
    }
    .narv-desk {
      position: absolute;
      left: 0; right: 0; bottom: 16%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,190,120,0.28), transparent);
      opacity: 0;
      z-index: 2;
    }
    .narv-desk.on { opacity: 1; transition: opacity 1.4s ease; }

    /* ===== warmth layer: living motes + phone motif ===== */
    .narv-motes {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 1.8s ease;
    }
    .narv-motes.on { opacity: 1; }

    .narv-phone {
      position: absolute;
      left: 50%; top: 60%;
      transform: translate(-50%, -50%) scale(0.86);
      width: 62px; height: 116px;
      border: 1.5px solid rgba(245,240,230,0.34);
      border-radius: 15px;
      background: radial-gradient(125% 78% at 50% 30%, rgba(255,210,150,0.12), rgba(255,190,120,0.04) 60%, transparent 76%);
      box-shadow: 0 0 28px 7px rgba(255,196,128,0.18), inset 0 0 18px rgba(255,200,140,0.10);
      opacity: 0;
      transition: opacity 1.3s ease, transform 1.3s ease;
      z-index: 4;
      pointer-events: none;
    }
    .narv-phone::before {
      content: '';
      position: absolute;
      left: 50%; bottom: 9px;
      width: 18px; height: 3px; border-radius: 3px;
      transform: translateX(-50%);
      background: rgba(245,240,230,0.42);
    }
    .narv-phone.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .narv-text {
      position: absolute;
      left: 50%; top: 42%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: min(86vw, 760px);
      text-align: center;
      font-size: clamp(1.1rem, 4.4vw, 2rem);
      letter-spacing: 0.16em;
      line-height: 1.9;
      color: var(--paper-100);
      pointer-events: none;
      text-shadow: 0 2px 24px rgba(0,0,0,0.9);
    }
    .narv-text .ch {
      display: inline-block;
      opacity: 0;
      filter: blur(10px);
      transform: translateY(10px) scale(1.06);
      text-shadow: 0 0 18px rgba(255,206,150,0.22);
      animation: inkIn 1.3s ease forwards;
    }
    .narv-text.serif { font-family: 'Songti SC', 'STSong', 'SimSun', serif; }
    .narv-text.gold { color: #B9A47A; text-shadow: 0 2px 24px rgba(185,164,122,0.25); }
    .narv-text.tremble { animation: textTremble 0.5s ease; }
    .narv-text .dissolve { animation: inkWash 2.4s ease forwards; }
    @keyframes inkIn {
      to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    }
    @keyframes inkWash {
      0%   { opacity: 1; filter: blur(0); transform: translate(0, 0) scale(1); }
      42%  { opacity: 0.78; filter: blur(3px); }
      100% { opacity: 0; filter: blur(17px); transform: translate(var(--dx, 0px), var(--dy, -30px)) scale(1.4); }
    }
    @keyframes textTremble {
      0%, 100% { transform: translate(-50%, -50%) translateX(0); }
      25% { transform: translate(-50%, -50%) translateX(-3px) rotate(-0.4deg); }
      75% { transform: translate(-50%, -50%) translateX(3px) rotate(0.4deg); }
    }

    .narv-frag {
      position: absolute;
      z-index: 4;
      font-size: 1.1rem;
      color: rgba(185, 164, 122, 0.42);
      pointer-events: none;
      transform-origin: center;
      animation: fragLife 11s ease-in-out infinite;
    }
    @keyframes fragLife {
      0%   { transform: rotate(0deg) translate(0, 0); opacity: 0.5; }
      45%  { transform: rotate(150deg) translate(var(--tx, 0px), var(--ty, 0px)); opacity: 0.9; }
      55%  { transform: rotate(210deg) translate(var(--tx, 0px), var(--ty, 0px)); opacity: 0.9; }
      100% { transform: rotate(360deg) translate(0, 0); opacity: 0.5; }
    }

    .narv-oracle, .narv-wipe, .narv-glass {
      position: absolute;
      inset: 0;
      z-index: 6;
      width: 100%;
      height: 100%;
    }
    .narv-wipe { z-index: 7; cursor: none; touch-action: none; }
    .narv-glass { z-index: 9; pointer-events: none; }

    .narv-ripple {
      position: absolute;
      z-index: 8;
      width: 12px; height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      border: 1px solid rgba(245, 240, 230, 0.6);
      pointer-events: none;
      animation: rippleOut 1.1s ease-out forwards;
    }
    @keyframes rippleOut {
      0% { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(7); opacity: 0; }
    }

    .narv-hint2 {
      position: absolute;
      left: 50%; bottom: 12%;
      transform: translateX(-50%);
      z-index: 8;
      font-size: 0.84rem;
      letter-spacing: 0.28em;
      color: rgba(245, 240, 230, 0.55);
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }
    .narv-hint2.show { opacity: 1; animation: hintPulse 2.4s ease-in-out infinite; }
    @keyframes hintPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }

    /* ===== motion-first layers: night / window / moon / phone-cursor / feeling / sub ===== */
    .narv-night {
      position: absolute; inset: 0; z-index: 0;
      opacity: 0; transition: opacity 2.2s ease; pointer-events: none;
    }
    .narv-night.on { opacity: 1; }

    .narv-window {
      position: absolute; left: 50%; top: 27%;
      transform: translate(-50%, -50%);
      width: 30vmin; height: 38vmin;
      border: 1px solid rgba(245, 240, 230, 0.12);
      border-radius: 4px; opacity: 0;
      transition: opacity 2.6s ease; z-index: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(245,240,230,0.05), rgba(245,240,230,0.012));
    }
    .narv-window.on { opacity: 1; }
    .narv-window::before { /* 竖棂 */
      content: ''; position: absolute; left: 50%; top: 6%; bottom: 6%;
      width: 1px; background: rgba(245, 240, 230, 0.10); transform: translateX(-50%);
    }
    .narv-window::after { /* 横棂 */
      content: ''; position: absolute; top: 50%; left: 6%; right: 6%;
      height: 1px; background: rgba(245, 240, 230, 0.10); transform: translateY(-50%);
    }

    .narv-moon {
      position: absolute; left: 70%; top: 9%;
      width: 7vmin; height: 7vmin; border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, rgba(247,242,222,0.96), rgba(226,220,198,0.55) 58%, rgba(210,205,185,0.12) 78%);
      box-shadow: 0 0 46px 14px rgba(240,235,215,0.16);
      opacity: 0; transform: translateY(46px);
      transition: opacity 2.8s ease, transform 3.6s cubic-bezier(.2,.7,.2,1);
      z-index: 0; pointer-events: none;
    }
    .narv-moon.on { opacity: 0.82; transform: translateY(0); animation: moonBreath 7.5s ease-in-out infinite; }
    @keyframes moonBreath {
      0%, 100% { box-shadow: 0 0 40px 12px rgba(240,235,215,0.12); }
      50% { box-shadow: 0 0 60px 19px rgba(240,235,215,0.24); }
    }

    .narv-cursor {
      position: absolute; left: 50%; top: 46%;
      transform: translate(-50%, -50%);
      width: 2px; height: 18px;
      background: rgba(245, 240, 230, 0.82);
      opacity: 0; pointer-events: none;
    }
    .narv-cursor.on { animation: caretBlink 1.05s step-end infinite; }
    @keyframes caretBlink { 0%, 100% { opacity: 0.85; } 50% { opacity: 0; } }

    /* 手机虚拟打字：文字紧贴光标左侧，逐字输入又删除 */
    .narv-phone-type {
      position: absolute; right: 56%; top: 46%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-size: 0.72rem; letter-spacing: 0.14em;
      color: rgba(245, 240, 230, 0.78);
      font-family: 'Songti SC', 'STSong', 'SimSun', serif;
      text-shadow: 0 0 10px rgba(255,206,150,0.35);
      pointer-events: none;
    }

    .narv-ghost {
      position: absolute; left: 50%; top: 46%;
      transform: translate(-50%, -50%);
      font-size: 0.94rem; color: rgba(245, 240, 230, 0.7);
      letter-spacing: 0.2em; opacity: 0;
      pointer-events: none; text-shadow: 0 0 14px rgba(255,206,150,0.3);
      animation: ghostFade 1.5s ease forwards;
    }
    @keyframes ghostFade {
      0% { opacity: 0; filter: blur(6px); transform: translate(-50%, -50%) scale(1.08); }
      35% { opacity: 0.7; filter: blur(0); }
      100% { opacity: 0; filter: blur(7px); transform: translate(-50%, -54%) scale(0.96); }
    }

    .narv-feeling {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 32vmin; height: 32vmin; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,190,140,0.34), rgba(255,170,110,0.12) 46%, rgba(255,170,110,0) 72%);
      filter: blur(5px);
      opacity: 0; z-index: 5; pointer-events: none;
      transition: opacity 1.4s ease;
    }
    .narv-feeling.on { opacity: 1; animation: feelingPulse 3.2s ease-in-out infinite; }
    @keyframes feelingPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }
    .narv-feeling.condense { animation: feelingCondense 1.7s ease forwards; }
    @keyframes feelingCondense {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.92; }
      100% { transform: translate(-50%, -50%) scale(0.42); opacity: 0.18; }
    }

    .narv-sub {
      position: absolute; left: 50%; bottom: 15%;
      transform: translateX(-50%);
      z-index: 6; font-size: 0.82rem; letter-spacing: 0.32em;
      color: rgba(245, 240, 230, 0.42);
      opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      text-align: center; width: min(88vw, 660px);
    }
    .narv-sub.show { opacity: 1; }
    .narv-sub.gold { color: rgba(185, 164, 122, 0.5); }
    .narv-sub.whisper { font-size: 0.74rem; letter-spacing: 0.26em; }
    .narv-sub.whisper.show { opacity: 0.46; }

    /* ===== breathing vignette (step 04 无名之绪：暗角呼吸，强化未命名张力) ===== */
    .narv-vignette {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, transparent 34%, rgba(0,0,0,0.62) 100%);
      opacity: 0; transition: opacity 1.6s ease;
    }
    .narv-vignette.on { opacity: 1; animation: vignettePulse 4.6s ease-in-out infinite; }
    @keyframes vignettePulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.92; } }

    /* ===== ghost "name" (step 04 无名之绪：一个「名」反复想成形却碎散，动效即「曾经没有名字」) ===== */
    .narv-ghost {
      position: absolute; left: 50%; top: 45%;
      transform: translate(-50%, -50%);
      z-index: 5; font-family: 'STKaiti', 'KaiTi', 'Songti SC', serif;
      font-size: 6rem; line-height: 1; font-weight: 500;
      color: rgba(185, 164, 122, 0); pointer-events: none;
      text-shadow: 0 0 34px rgba(185, 164, 122, 0);
      opacity: 0; filter: blur(10px);
    }
    .narv-ghost.try { animation: ghostTry 4.4s cubic-bezier(.4,0,.3,1) forwards; }
    @keyframes ghostTry {
      0%   { opacity: 0; filter: blur(12px); transform: translate(-50%,-50%) scale(0.74); }
      26%  { opacity: 0.6; filter: blur(1.2px); transform: translate(-50%,-50%) scale(1.0); }   /* 几乎成形 */
      40%  { opacity: 0.66; filter: blur(0.4px); transform: translate(-50.6%,-50.4%) scale(1.04) rotate(-1.4deg); } /* 颤抖：将成未成 */
      54%  { opacity: 0.5; filter: blur(2.2px); transform: translate(-50%,-50%) scale(1.0) rotate(0.8deg); }
      72%  { opacity: 0.18; filter: blur(5px); transform: translate(-50%,-50%) scale(0.96); }    /* 开始碎散 */
      100% { opacity: 0; filter: blur(14px); transform: translate(-50%,-50%) scale(0.82); }       /* 散去：终究无名 */
    }

    /* ===== center light burst (step 06 造字：古字汇聚成「字」时的一束光) ===== */
    .narv-bloom {
      position: absolute; left: 50%; top: 46%;
      transform: translate(-50%, -50%) scale(0.2);
      width: 34vmin; height: 34vmin; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,238,200,0.6), rgba(255,200,130,0.2) 44%, rgba(255,190,110,0) 72%);
      opacity: 0; z-index: 8; pointer-events: none; mix-blend-mode: screen;
    }
    .narv-bloom.flash { animation: bloomFlash 1.5s ease-out forwards; }
    @keyframes bloomFlash {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      32% { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
    }

    /* (enhanced FX layers removed — base 6-step narrative) */

    .narv-enter {
      position: absolute;
      left: 50%; bottom: 13%;
      transform: translateX(-50%) translateY(20px);
      z-index: 10;
      padding: 14px 46px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: var(--paper-100);
      cursor: pointer;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      border: 1px solid rgba(245, 240, 230, 0.35);
      border-radius: 3px;
      background: rgba(245, 240, 230, 0.04);
      transition: opacity 0.9s ease, transform 0.9s ease, background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
    }
    .narv-enter.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .narv-enter:hover {
      background: rgba(184, 155, 74, 0.14);
      border-color: var(--gold);
      color: #fff;
      box-shadow: 0 0 30px rgba(184, 155, 74, 0.3);
    }

    /* ===== narrative sound toggle (top-right) ===== */
    .narv-sound {
      position: absolute;
      top: 14px; right: 12px;
      z-index: 14;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(245, 240, 230, 0.22);
      background: rgba(10, 9, 8, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      pointer-events: auto;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .narv-sound:hover { border-color: var(--gold); background: rgba(22, 18, 12, 0.7); transform: scale(1.06); }
    .narv-sound img { width: 16px; height: 16px; filter: invert(0.92) sepia(0.18); pointer-events: none; }
    .narv-sound .slash {
      position: absolute;
      left: 50%; top: 50%;
      width: 22px; height: 2px;
      background: rgba(245, 240, 230, 0.85);
      border-radius: 2px;
      transform: translate(-50%, -50%) rotate(-45deg);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .narv-sound.muted .slash { opacity: 1; }
    .narv-sound.muted img { opacity: 0.45; }

    /* ===== narrative skip button (top-right, beside sound) ===== */
    .narv-skip {
      position: absolute;
      top: 14px; right: 54px;
      z-index: 14;
      height: 34px;
      padding: 0 14px;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      color: rgba(245, 240, 230, 0.85);
      border-radius: 999px;
      border: 1px solid rgba(245, 240, 230, 0.22);
      background: rgba(10, 9, 8, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      pointer-events: auto;
      opacity: 0;
      transition: opacity 0.6s ease, border-color 0.3s ease, background 0.3s ease, color 0.3s ease, transform 0.3s ease;
    }
    .narv-skip.show { opacity: 1; }
    .narv-skip:hover { border-color: var(--gold); color: #fff; background: rgba(22, 18, 12, 0.7); transform: scale(1.04); }

    @keyframes msUp { to { opacity: 1; transform: translateY(0); } }

    /* ===== Opening gate (kaichangbeijingtu + flowing river + stars + glass cursor) ===== */
    .opening {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #000;
      transition: opacity 1.4s ease, visibility 1.4s ease;
    }
    .opening.done { opacity: 0; visibility: hidden; pointer-events: none; }

    .opening .obg {
      position: absolute;
      inset: 0;
      background: url('kaichangbeijingtu.png') center center / cover no-repeat;
      transform: scale(1.06);
      animation: obgDrift 26s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes obgDrift {
      0%   { transform: scale(1.06) translate(-1.2%, -0.8%); }
      50%  { transform: scale(1.10) translate(1.0%, 0.6%); }
      100% { transform: scale(1.07) translate(0.6%, -1.1%); }
    }

    /* flowing river light + caustics */
    .opening .oriver {
      position: absolute;
      inset: -20%;
      z-index: 1;
      pointer-events: none;
      background:
        repeating-linear-gradient(105deg,
          rgba(245,240,230,0) 0px,
          rgba(245,240,230,0.05) 60px,
          rgba(201,168,86,0.04) 120px,
          rgba(245,240,230,0) 200px);
      mix-blend-mode: screen;
      opacity: 0.7;
      animation: riverFlow 14s linear infinite;
    }
    @keyframes riverFlow {
      0%   { background-position: 0 0; }
      100% { background-position: 600px 240px; }
    }
    .opening .ocaustics {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.5;
    }

    .opening #openingStars {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .opening canvas {
      position: absolute;
      inset: 0;
      z-index: 3;
      touch-action: none;
      cursor: none;
    }

    .opening .oguide {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-size: clamp(240px, 52vw, 560px);
      font-weight: 700;
      color: rgba(245, 240, 230, 0.05);
      pointer-events: none;
      letter-spacing: 0;
      text-shadow: 0 0 60px rgba(245,240,230,0.08);
      transition: opacity 0.6s ease, color 0.6s ease;
    }
    .opening .oguide.glow {
      color: rgba(245, 240, 230, 0.16);
      text-shadow: 0 0 90px rgba(201, 168, 86, 0.5);
    }

    .opening .oui {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px 34px;
    }
    .opening .otop {
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeDown 1.2s ease 0.3s forwards;
    }
    .opening .otop h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      letter-spacing: 0.45em;
      text-indent: 0.45em;
      font-weight: 700;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .opening .otop p {
      margin-top: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: rgba(245,240,230,0.55);
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .opening .ohint {
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: rgba(245,240,230,0.5);
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      opacity: 0;
      animation: fadeUp 1.2s ease 0.8s forwards;
    }

    .opening .ocontrols {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 5;
      pointer-events: auto;
    }
    .opening .ocontrols button {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(245,240,230,0.22);
      color: rgba(245,240,230,0.8);
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      padding: 7px 12px;
      border-radius: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: all 0.3s ease;
      margin-left: 8px;
    }
    .opening .ocontrols button:hover { background: rgba(0,0,0,0.55); color: var(--paper-100); }
    #enterBtn { display: none; }
    #enterBtn.show { display: inline-block; }

    .opening .osuccring {
      position: absolute;
      left: 50%; top: 50%;
      width: 120vmax; height: 120vmax;
      transform: translate(-50%, -50%) scale(0);
      z-index: 6;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,86,0.18) 0%, transparent 55%);
      pointer-events: none;
      transition: transform 1.4s cubic-bezier(0.22,1,0.36,1), opacity 1s ease;
    }
    .opening .osuccring.open {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
    }
    .opening .osucctext {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      font-weight: 700;
      color: var(--paper-100);
      text-shadow: 0 0 60px rgba(201,168,86,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .opening .osucctext.show { opacity: 1; }

    /* ===== Create-journey overlay (开始造字之旅) ===== */
    .create-journey {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(28,24,20,0.6) 0%, transparent 60%),
        rgba(2,2,2,0.93);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow-y: auto;
    }
    .create-journey.show { opacity: 1; visibility: visible; }

    .cj-inner {
      position: relative;
      width: 100%;
      max-width: 560px;
      padding: 54px 26px 40px;
      text-align: center;
    }
    .cj-seed {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      color: var(--paper-100);
      text-shadow: 0 0 40px rgba(245,240,230,0.12);
      opacity: 0;
      transform: translateY(16px);
      animation: msUp 0.9s ease 0.1s forwards;
    }
    .cj-sub {
      margin: 14px auto 26px;
      font-size: 0.92rem;
      line-height: 1.9;
      letter-spacing: 0.06em;
      color: rgba(232,224,208,0.7);
      max-width: 420px;
      opacity: 0;
      transform: translateY(16px);
      animation: msUp 0.9s ease 0.26s forwards;
    }
    .cj-input {
      width: 100%;
      max-width: 360px;
      padding: 13px 18px;
      background: rgba(245,240,230,0.04);
      border: 1px solid rgba(245,240,230,0.18);
      border-radius: 4px;
      color: var(--paper-100);
      font-family: inherit;
      font-size: 1.05rem;
      letter-spacing: 0.18em;
      text-align: center;
      outline: none;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      opacity: 0;
      transform: translateY(16px);
      animation: msUp 0.9s ease 0.42s forwards;
    }
    .cj-input::placeholder { color: rgba(232,224,208,0.35); letter-spacing: 0.1em; }
    .cj-input:focus { border-color: var(--gold); box-shadow: 0 0 22px rgba(184,155,74,0.25); }

    .cj-canvas {
      display: block;
      width: 100%;
      max-width: 360px;
      height: 230px;
      margin: 22px auto 6px;
      border: 1px dashed rgba(245,240,230,0.16);
      border-radius: 8px;
      background: rgba(245,240,230,0.02);
      cursor: crosshair;
      opacity: 0;
      transform: translateY(16px);
      animation: msUp 0.9s ease 0.58s forwards;
    }
    .cj-caption {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: rgba(232,224,208,0.4);
      margin-bottom: 22px;
      opacity: 0;
      animation: msUp 0.9s ease 0.7s forwards;
    }

    .cj-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      opacity: 0;
      transform: translateY(16px);
      animation: msUp 0.9s ease 0.8s forwards;
    }
    .cj-btn {
      padding: 12px 28px;
      background: var(--gold);
      border: 1px solid var(--gold);
      color: #1a160e;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      border-radius: 3px;
      cursor: pointer;
      transition: filter 0.3s ease, box-shadow 0.3s ease;
    }
    .cj-btn:hover { filter: brightness(1.12); box-shadow: 0 0 26px rgba(184,155,74,0.4); }
    .cj-btn.ghost {
      background: transparent;
      border-color: rgba(245,240,230,0.28);
      color: var(--paper-200);
    }
    .cj-btn.ghost:hover { color: var(--paper-100); border-color: rgba(245,240,230,0.55); box-shadow: none; }

    /* ===== BorderGlow 边框光晕按钮效果（开始造字之旅） ===== */
    .border-glow {
      position: relative;
      border-radius: 28px;
      background: #120F17;
      isolation: isolate;
      overflow: visible;
    }
    .border-glow::before,
    .border-glow::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
              mask-composite: exclude;
      pointer-events: none;
      opacity: var(--near, 0);
      transition: opacity 0.35s ease;
    }
    .border-glow::before {
      background: conic-gradient(from var(--ang, 0deg), #c084fc, #f472b6, #38bdf8, #c084fc);
    }
    .border-glow::after {
      background: radial-gradient(circle var(--gr, 40px) at var(--mx, 50%) var(--my, 50%),
        rgba(var(--gc, 40 80 80), var(--gi, 1)) 0%, transparent 72%);
    }
    .border-glow.active::before,
    .border-glow.active::after { opacity: 1; }

    .cj-btn.border-glow {
      background: #120F17;
      border: none;
      color: var(--gold);
      box-shadow: 0 0 0 1px rgba(245,240,230,0.10);
    }
    .cj-btn.border-glow.ghost {
      color: rgba(232,224,208,0.85);
    }
    .cj-btn.border-glow:hover {
      filter: none;
      box-shadow: 0 0 0 1px rgba(245,240,230,0.10), 0 0 26px rgba(192,132,252,0.22);
    }

    .cj-close {
      position: absolute;
      top: 14px; right: 16px;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(245,240,230,0.18);
      background: rgba(10, 9, 8, 0.5);
      color: var(--paper-100);
      font-size: 1.4rem;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2;
    }

    .cj-result {
      margin-top: 24px;
      min-height: 10px;
    }
    .cj-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 150px; height: 150px;
      border: 3px solid var(--seal);
      border-radius: 8px;
      background: rgba(168,63,57,0.06);
      color: var(--seal-light);
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 0 40px rgba(168,63,57,0.35), inset 0 0 24px rgba(168,63,57,0.18);
      animation: sealStamp 0.7s cubic-bezier(0.22,1,0.36,1) both;
      overflow: hidden;
    }
    .cj-seal img { width: 78%; height: 78%; object-fit: contain; }
    @keyframes sealStamp {
      0% { transform: scale(1.5) rotate(-8deg); opacity: 0; }
      60% { transform: scale(0.94) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .cj-seal-name {
      margin-top: 18px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: var(--paper-100);
    }
    .cj-seal-note {
      margin-top: 8px;
      font-size: 0.86rem;
      letter-spacing: 0.1em;
      color: rgba(232,224,208,0.62);
    }

    .cj-restart {
      margin-top: 22px;
      background: none;
      border: none;
      color: rgba(232,224,208,0.5);
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* ===== Scroll Mask transition (black-out → reveal next page) ===== */
    #scrollMask {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

  <script>
  // ===================================================================
  //  GALLERY  (3D infinite parallax cloud)
  // ===================================================================
  const items = [
    { file: 'anxin.png',    title: '安心', pinyin: 'ān xīn',   tag: '会意 · 象形', desc: '“安”从女在宀下，屋下有女则安定，会意也；“心”象形，象心脏之形。屋宇庇护，女子安然，心得其所，是为安心。' },
    { file: 'benshang.png', title: '悲伤', pinyin: 'bēi shāng', tag: '形声',       desc: '“悲”从心，非声，非本有违背、哀痛之意；“伤”从人，省声。非声入心，痛彻肝肠；人逢离别，悲从中来。' },
    { file: 'fennu.png',    title: '愤怒', pinyin: 'fèn nù',    tag: '形声',       desc: '“愤”从心，贲声，气满胸臆；“怒”从心，奴声，心被压制而爆发。贲声激越，奴心难抑；怒火中烧，势不可遏。' },
    { file: 'gudu.png',     title: '孤独', pinyin: 'gū dú',     tag: '形声',       desc: '“孤”从子，瓜声，幼而无父曰孤；“独”从犬，蜀声，一犬独行。孑然一身，瓜声如叹；独对长空，形影相吊。' },
    { file: 'kongju.png',   title: '恐惧', pinyin: 'kǒng jù',   tag: '形声',       desc: '“恐”从心，巩声，心有畏巩；“惧”从心，瞿声，瞿然惊视。巩声颤心，瞿目四顾；幽林孤灯，惧由心生。' },
    { file: 'qidai.png',    title: '期待', pinyin: 'qī dài',    tag: '形声',       desc: '“期”从月，其声，月满为期；“待”从彳，寺声，止而等候。月满其期，伫立以待；晨光初露，希望在前。' },
    { file: 'xiyue.png',    title: '喜悦', pinyin: 'xǐ yuè',    tag: '会意 · 形声', desc: '“喜”从壴从口，鼓乐欢庆，会意也；“悦”从心，兑声。鼓乐张口，喜上眉梢；心悦神畅，如沐春风。' },
    { file: 'zhenfen.png',  title: '振奋', pinyin: 'zhèn fèn',  tag: '形声 · 会意', desc: '“振”从手，辰声，振衣而起；“奋”从奞在田上，鸟奋翼欲飞。振衣云端，奋翼九霄；红旗猎猎，意气风发。' }
  ];

  const moodLines = {
    '安心': '屋檐之下，心有所栖',
    '悲伤': '雨落肩头，未曾说出口',
    '愤怒': '胸中火起，烧断沉默',
    '孤独': '人潮之中，自成孤岛',
    '恐惧': '暗处有声，呼吸变轻',
    '期待': '晨光未亮，已起身等候',
    '喜悦': '风过眉梢，嘴角先笑',
    '振奋': '振衣千仞，意气凌云'
  };

  const cloud = document.getElementById('cloud');
  const scene = document.getElementById('scene');
  const dragHint = document.getElementById('dragHint');
  const detailOverlay = document.getElementById('detailOverlay');
  const detailPanel = document.getElementById('detailPanel');
  const detailContent = document.getElementById('detailContent');
  const closeBtn = document.getElementById('closeBtn');
  const createBtn = document.getElementById('createBtn');

  // ===== 悲伤情绪卡片：细雨滴下落动效（细、长、透明，整体极淡）=====
  const rainCanvas = document.getElementById('rainCanvas');
  const rctx = rainCanvas.getContext('2d');
  let rainRAF = null;
  const RainFX = (() => {
    let drops = [], active = false, w = 0, h = 0;
    function size() {
      w = window.innerWidth; h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      rainCanvas.width = Math.floor(w * dpr);
      rainCanvas.height = Math.floor(h * dpr);
      rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function spawn(init) {
      const len = 14 + Math.random() * 26;       // 细而长
      return {
        x: Math.random() * w,
        y: init ? Math.random() * h : -len - Math.random() * 40,
        len,
        speed: 4 + Math.random() * 5,            // 下落速度
        slant: 1.2 + Math.random() * 1.0,        // 风斜
        w: 0.8 + Math.random() * 0.6,            // 细
        a: 0.05 + Math.random() * 0.10           // 透明
      };
    }
    function makeDrops() {
      const count = w < 640 ? 70 : 150;
      drops = [];
      for (let i = 0; i < count; i++) drops.push(spawn(true));
    }
    function frame() {
      rctx.clearRect(0, 0, w, h);
      rctx.lineCap = 'round';
      for (const d of drops) {
        rctx.strokeStyle = 'rgba(176,198,224,' + d.a + ')';
        rctx.lineWidth = d.w;
        rctx.beginPath();
        rctx.moveTo(d.x, d.y);
        rctx.lineTo(d.x + d.slant, d.y + d.len);
        rctx.stroke();
        d.y += d.speed;
        d.x += d.slant * 0.15;
        if (d.y > h + d.len) { d.y = -d.len - Math.random() * 30; d.x = Math.random() * w; }
      }
      rainRAF = requestAnimationFrame(frame);
    }
    return {
      start() {
        if (active) return;
        active = true; size(); makeDrops();
        rainCanvas.classList.add('on');
        if (rainRAF) cancelAnimationFrame(rainRAF);
        frame();
      },
      stop() {
        active = false;
        rainCanvas.classList.remove('on');
        if (rainRAF) { cancelAnimationFrame(rainRAF); rainRAF = null; }
        rctx.clearRect(0, 0, w, h);
      },
      resize() { if (active) size(); }
    };
  })();

  const PERSPECTIVE = 1500;
  const COPIES_PER_ITEM = 9;
  const AUTO_SPEED = 0.16;
  const INERTIA_DECAY = 0.93;
  const PARALLAX_AMT = 80;
  const FOCUS_NEAR = 540;
  const HOVER_SCALE = 0.14;

  let cards = [];
  const cardEls = new Map();
  let camera = { x: 0, y: 0 };
  let targetCamera = { x: 0, y: 0 };
  let velX = 0, velY = 0;
  let isDragging = false;
  let lastPointer = { x: 0, y: 0 };
  let downX = 0, downY = 0;
  let dragDistance = 0;
  let downCardEl = null;
  let didDrag = false;
  let lastFocusTs = 0;
  let hintShown = false;

  const pointers = new Map();
  let isPinching = false;
  let pinchPrevDist = 0;
  let pinchPrevMid = { x: 0, y: 0 };
  let viewScale = 1;
  let targetViewScale = 1;

  let parX = 0, parY = 0;
  let parTX = 0, parTY = 0;

  let focusedCard = null;
  let currentZikaItem = null;

  const t0 = performance.now();

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const midOf = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const depthFactor = (z) => PERSPECTIVE / (PERSPECTIVE - z);

  function initGallery() {
    createCards();
    bindEvents();
    requestAnimationFrame(animate);
  }

  function createCards() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const bands = [
      { count: 1, zMin: 140,  zMax: 250,  sizeMin: 165, sizeMax: 220 },
      { count: 2, zMin: -210, zMax: -30,  sizeMin: 112, sizeMax: 172 },
      { count: 2, zMin: -580, zMax: -300, sizeMin: 70,  sizeMax: 116 },
      { count: 4, zMin: -1090,zMax: -720, sizeMin: 40,  sizeMax: 76  }
    ];

    const spreadX = vw * 2.7;
    const spreadY = vh * 2.05;

    items.forEach((item) => {
      bands.forEach((band) => {
        for (let i = 0; i < band.count; i++) {
          let x, y;
          if (band.zMin > 0) {
            let tries = 0;
            do {
              x = (Math.random() * 2 - 1) * spreadX * 0.7;
              y = (Math.random() * 2 - 1) * spreadY * 0.7;
              tries++;
            } while (tries < 12 && cards.some(c => c.z > 0 && Math.hypot(c.x - x, c.y - y) < 360));
          } else {
            x = (Math.random() * 2 - 1) * spreadX;
            y = (Math.random() * 2 - 1) * spreadY;
          }

          const z = band.zMin + Math.random() * (band.zMax - band.zMin);
          const size = band.sizeMin + Math.random() * (band.sizeMax - band.sizeMin);
          const w = size;
          const h = size / 0.75;

          const el = document.createElement('div');
          el.className = 'card';
          el.style.width = w + 'px';
          el.style.height = h + 'px';
          el.style.marginLeft = (w / -2) + 'px';
          el.style.marginTop = (h / -2) + 'px';
          el.setAttribute('data-title', item.title);
          el.innerHTML = `
            <img src="${item.file}" alt="${item.title}" loading="lazy" draggable="false"
                 onerror="this.parentNode.classList.add('img-missing')">
            <div class="card-label">${item.title}</div>
          `;

          const labelEl = el.querySelector('.card-label');
          const cardObj = {
            el, labelEl,
            x, y, z,
            itemIndex: items.indexOf(item),
            rot: (Math.random() - 0.5) * 9,
            phase: Math.random() * Math.PI * 2,
            bobAmp: 3 + Math.random() * 4,
            rotAmp: 1 + Math.random() * 1.5,
            hovered: false,
            hoverT: 0,
            focusActive: false,
            focusAnimT: 0,
            exiting: false,
            baseW: w, baseH: h
          };

          el.addEventListener('mouseenter', () => { if (!focusedCard) cardObj.hovered = true; });
          el.addEventListener('mouseleave', () => { cardObj.hovered = false; });

          cloud.appendChild(el);
          cardEls.set(el, cardObj);
          cards.push(cardObj);
        }
      });
    });

    if (!window.matchMedia('(hover: hover)').matches) {
      document.body.classList.add('show-labels');
    }
  }

  function bindEvents() {
    scene.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    // 手机端兜底：触屏轻点（非拖拽）打开字卡。部分浏览器会吞掉 pointer 合成 click，这里双保险确保可靠触发。
    scene.addEventListener('click', (e) => {
      if (didDrag) return;
      const cardEl = (e.target && e.target.closest) ? e.target.closest('.card') : null;
      if (!cardEl) return;
      tryFocusCard(cardEls.get(cardEl));
    });

    window.addEventListener('resize', () => {
      const vw = window.innerWidth, vh = window.innerHeight;
      cards.forEach(card => {
        if (Math.abs(card.x) > vw * 4) card.x *= 0.5;
        if (Math.abs(card.y) > vh * 3) card.y *= 0.5;
      });
      RainFX.resize();
    });

    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); exitFocus(); });
    detailOverlay.addEventListener('click', (e) => {
      // 刚打开字卡时，忽略由「点击卡片」产生的合成 click（此时遮罩已激活、命中遮罩自身），
      // 否则字卡一打开就会被立刻关闭——这是手机/电脑端点击卡片后字卡不显示的根因
      if (performance.now() - lastFocusTs < 450) return;
      if (e.target === detailOverlay || e.target === detailPanel) exitFocus();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (createJourney.classList.contains('show')) closeCreate();
        else if (detailOverlay.classList.contains('active')) exitFocus();
      }
    });

    createBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentZikaItem) startScrollTransition(currentZikaItem);
    });
  }

  function onPointerDown(e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      isDragging = true;
      dragDistance = 0;
      didDrag = false;
      lastPointer.x = e.clientX;
      lastPointer.y = e.clientY;
      downX = e.clientX;
      downY = e.clientY;
      velX = 0; velY = 0;
      downCardEl = (e.target && e.target.closest) ? e.target.closest('.card') : null;
      showHint();
    } else if (pointers.size === 2) {
      isDragging = false;
      isPinching = true;
      downCardEl = null;
      const pts = [...pointers.values()];
      pinchPrevDist = dist(pts[0], pts[1]);
      pinchPrevMid = midOf(pts[0], pts[1]);
      velX = 0; velY = 0;
      showHint();
    }
  }

  function onPointerMove(e) {
    const vw = window.innerWidth, vh = window.innerHeight;
    parTX = -(e.clientX / vw - 0.5) * PARALLAX_AMT;
    parTY = -(e.clientY / vh - 0.5) * PARALLAX_AMT;

    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (isPinching && pointers.size >= 2) {
      e.preventDefault();
      const pts = [...pointers.values()];
      const d = dist(pts[0], pts[1]);
      const m = midOf(pts[0], pts[1]);

      if (pinchPrevDist > 0) {
        targetViewScale = clamp(targetViewScale * (d / pinchPrevDist), 0.45, 3.2);
      }
      const mdx = m.x - pinchPrevMid.x;
      const mdy = m.y - pinchPrevMid.y;
      targetCamera.x -= mdx / viewScale;
      targetCamera.y -= mdy / viewScale;
      dragDistance += Math.hypot(mdx, mdy);
      didDrag = true;

      pinchPrevDist = d;
      pinchPrevMid = m;
      return;
    }

    if (isDragging) {
      e.preventDefault();
      const dx = e.clientX - lastPointer.x;
      const dy = e.clientY - lastPointer.y;
      lastPointer.x = e.clientX;
      lastPointer.y = e.clientY;
      dragDistance += Math.sqrt(dx * dx + dy * dy);
      if (dragDistance > 12) didDrag = true;

      const rx = -dx * 1.1;
      const ry = -dy * 1.1;
      targetCamera.x += rx;
      targetCamera.y += ry;
      velX = rx; velY = ry;
    }
  }

  function onPointerUp(e) {
    pointers.delete(e.pointerId);

    if (pointers.size < 2) {
      isPinching = false;
      pinchPrevDist = 0;
    }

    if (pointers.size === 0) {
      isDragging = false;
      // 轻点（拖拽距离很小）落在某张卡片上 → 进入字卡焦点（桌面 / 手机一致）
      if (downCardEl && dragDistance <= 30) {
        tryFocusCard(cardEls.get(downCardEl));
      }
      downCardEl = null;
    } else if (pointers.size === 1) {
      const [p] = [...pointers.values()];
      lastPointer.x = p.x;
      lastPointer.y = p.y;
      isDragging = true;
      dragDistance = 999;
      velX = 0; velY = 0;
    }
  }

  function showHint() {
    if (hintShown) return;
    hintShown = true;
    dragHint.classList.add('show');
    setTimeout(() => dragHint.classList.remove('show'), 4200);
  }

  function tryFocusCard(obj) {
    if (!obj) return;
    const t = performance.now();
    if (t - lastFocusTs < 350) return; // 防抖：pointerup 与合成 click 可能双双触发，避免重复进入焦点
    lastFocusTs = t;
    enterFocus(obj);
  }

  function enterFocus(card) {
    pointers.clear();
    isPinching = false;
    isDragging = false;
    pinchPrevDist = 0;
    dragDistance = 999;
    velX = 0; velY = 0;

    if (focusedCard && focusedCard !== card) {
      focusedCard.exiting = true;
      focusedCard.el.classList.remove('focused');
    }

    focusedCard = card;
    card.hovered = false;
    card.el.classList.remove('hovered');
    card.focusActive = true;
    card.exiting = false;
    card.focusAnimT = 0;
    card.el.classList.add('focused');
    document.body.classList.add('focusing');

    const item = items[card.itemIndex];
    currentZikaItem = item;
    detailContent.setAttribute('data-char', item.title[0]);
    detailContent.innerHTML = `
      <div class="detail-pinyin">${item.pinyin}</div>
      <h2 class="detail-title">${item.title}</h2>
      <div class="detail-tag">${item.tag}</div>
      <p class="detail-desc">${item.desc}</p>
    `;
    detailOverlay.classList.add('active');
    // 悲伤情绪卡片：进入详情时落下细雨
    if (item.file === 'benshang.png') RainFX.start();
    // 详情页不显示玄玄，避免遮挡文字和按钮
    if (window.XuanXuan && window.XuanXuan._el) window.XuanXuan._el.style.display = 'none';
  }

  function exitFocus() {
    detailOverlay.classList.remove('active');
    RainFX.stop();
    document.body.classList.remove('focusing');
    if (focusedCard) {
      focusedCard.exiting = true;
      focusedCard.el.classList.remove('focused');
      focusedCard = null;
    }
    currentZikaItem = null;
    velX = 0; velY = 0;
    // 返回画廊后重新显示玄玄（不重新触发入场台词）
    if (window.XuanXuan && window.XuanXuan._el) window.XuanXuan._el.style.display = 'block';
  }

  function updateCards(time) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const wrapX = vw * 4.4 * viewScale;
    const wrapY = vh * 3.4 * viewScale;

    const nearF = depthFactor(FOCUS_NEAR);
    const farF = depthFactor(-1090);
    const focusing = !!focusedCard;

    cards.forEach(card => {
      const f = depthFactor(card.z);
      const depthNorm = Math.max(0, Math.min(1, (f - farF) / (nearF - farF)));

      if (card.focusActive) {
        const goal = card.exiting ? 0 : 1;
        card.focusAnimT += (goal - card.focusAnimT) * 0.11;

        if (card.exiting && card.focusAnimT < 0.02) {
          card.focusAnimT = 0;
          card.focusActive = false;
          card.exiting = false;
          card.el.style.zIndex = Math.round(1000 + card.z);
          return;
        }

        const t = card.focusAnimT;
        const basePx = (card.x - camera.x - parX) * f * viewScale;
        const basePy = (card.y - camera.y - parY) * f * viewScale;
        const baseScale = f * viewScale * (1 + 0.16 * depthNorm);
        const focusScale = nearF * viewScale * 1.12;
        const px = basePx * (1 - t);
        const py = basePy * (1 - t);
        const scale = baseScale + (focusScale - baseScale) * t;
        const zEff = card.z + (FOCUS_NEAR - card.z) * t;

        card.el.style.transform = `translate3d(${px}px, ${py}px, ${zEff}px) scale(${scale}) rotate(${card.rot * (1 - t)}deg)`;
        card.el.style.opacity = 1;
        card.el.style.filter = `blur(${7 * (1 - depthNorm) * (1 - t)}px) brightness(${0.5 + 0.5 * t})`;
        card.el.style.zIndex = 3000;
        return;
      }

      const bob = Math.sin(time * 0.0006 + card.phase) * card.bobAmp;
      const rotWobble = Math.sin(time * 0.0004 + card.phase) * card.rotAmp;

      let px = (card.x - camera.x) * f * viewScale;
      let py = (card.y - camera.y) * f * viewScale + bob * f * viewScale;

      if (px < -vw * 2.0) card.x += wrapX;
      else if (px > vw * 2.0) card.x -= wrapX;
      if (py < -vh * 1.6) card.y += wrapY;
      else if (py > vh * 1.6) card.y -= wrapY;

      px = (card.x - camera.x) * f * viewScale;
      py = (card.y - camera.y) * f * viewScale + bob * f * viewScale;

      px -= parX * f * viewScale;
      py -= parY * f * viewScale;

      card.hoverT += ((card.hovered ? 1 : 0) - card.hoverT) * 0.18;
      const hov = card.hoverT;

      let opacity = 0.1 + 0.9 * Math.pow(depthNorm, 0.6);
      let blur = (1 - depthNorm) * 7;
      let brightness = 0.3 + 0.7 * depthNorm;
      let scale = f * viewScale * (1 + 0.16 * depthNorm);

      scale *= 1 + HOVER_SCALE * hov;
      brightness += 0.22 * hov;
      opacity = Math.min(1, opacity + 0.08 * hov);

      if (focusing) {
        opacity = opacity * 0.5 + 0.05;
        blur += 3.2;
        brightness *= 0.72;
      }

      card.el.style.transform = `translate3d(${px}px, ${py}px, ${card.z}px) scale(${scale}) rotate(${card.rot + rotWobble}deg)`;
      card.el.style.opacity = opacity;
      card.el.style.filter = `blur(${blur}px) brightness(${brightness})`;
      card.el.style.zIndex = Math.round(1000 + card.z + (hov > 0.3 ? 600 : 0));

      if (hov > 0.05) card.el.classList.add('hovered');
      else card.el.classList.remove('hovered');
    });
  }

  function animate() {
    const now = performance.now();
    const time = now - t0;
    const focusing = !!focusedCard;

    if (!isDragging && !isPinching && !focusing) {
      if (Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02) {
        targetCamera.x += velX;
        targetCamera.y += velY;
        velX *= INERTIA_DECAY;
        velY *= INERTIA_DECAY;
      } else {
        velX = 0; velY = 0;
        targetCamera.x += AUTO_SPEED;
      }
    }

    const ptx = (isDragging || isPinching || focusing) ? 0 : parTX;
    const pty = (isDragging || isPinching || focusing) ? 0 : parTY;
    parX += (ptx - parX) * 0.06;
    parY += (pty - parY) * 0.06;

    camera.x += (targetCamera.x - camera.x) * 0.08;
    camera.y += (targetCamera.y - camera.y) * 0.08;
    viewScale += (targetViewScale - viewScale) * 0.15;

    updateCards(time);
    requestAnimationFrame(animate);
  }

  // ===================================================================
  //  AMBIENT STARFIELD  (global + opening)
  // ===================================================================
  function makeStarField(canvas) {
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, dpr = 1;
    let stars = [], streaks = [];

    function resize() {
      w = window.innerWidth; h = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((w * h) / 9000);
      stars = [];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w, y: Math.random() * h,
          r: Math.random() * 1.5 + 0.4,
          a: Math.random() * 0.5 + 0.3,
          ph: Math.random() * Math.PI * 2,
          sp: Math.random() * 0.7 + 0.3,
          dy: -(Math.random() * 7 + 2),
          hue: Math.random() < 0.45 ? '201,168,86' : '245,240,230'
        });
      }
      streaks = [];
      const sc = Math.max(2, Math.round(count / 60));
      for (let i = 0; i < sc; i++) {
        streaks.push({
          x: Math.random() * w, y: Math.random() * h,
          len: Math.random() * 140 + 90,
          ang: Math.PI * (0.62 + Math.random() * 0.16),
          sp: Math.random() * 26 + 14,
          a: Math.random() * 0.18 + 0.08,
          ph: Math.random() * Math.PI * 2
        });
      }
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.y += s.dy * 0.016;
        if (s.y < -6) { s.y = h + 6; s.x = Math.random() * w; }
        const tw = s.a * (0.45 + 0.55 * Math.sin(t * 0.001 * s.sp + s.ph));
        const rr = s.r * 4;
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr);
        g.addColorStop(0, `rgba(${s.hue},${tw})`);
        g.addColorStop(1, `rgba(${s.hue},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI * 2); ctx.fill();
      }
      for (const st of streaks) {
        const dx = Math.cos(st.ang) * st.sp * 0.016;
        const dy = Math.sin(st.ang) * st.sp * 0.016;
        st.x += dx; st.y += dy;
        if (st.x > w + st.len || st.y > h + st.len || st.x < -st.len) {
          st.x = -st.len * Math.cos(st.ang); st.y = Math.random() * h * 0.5;
        }
        const ex = st.x + Math.cos(st.ang) * st.len;
        const ey = st.y + Math.sin(st.ang) * st.len;
        const tw = st.a * (0.5 + 0.5 * Math.sin(t * 0.0012 + st.ph));
        const g = ctx.createLinearGradient(st.x, st.y, ex, ey);
        g.addColorStop(0, `rgba(245,240,230,0)`);
        g.addColorStop(0.5, `rgba(245,240,230,${tw})`);
        g.addColorStop(1, `rgba(245,240,230,0)`);
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(ex, ey); ctx.stroke();
      }
    }
    return { resize, draw };
  }

  const globalStars = makeStarField(document.getElementById('starCanvas'));
  const openingStars = makeStarField(document.getElementById('openingStars'));
  globalStars.resize();
  openingStars.resize();
  window.addEventListener('resize', () => { globalStars.resize(); openingStars.resize(); });

  function starLoop() {
    const t = performance.now();
    globalStars.draw(t);
    if (!opening.classList.contains('done')) openingStars.draw(t);
    requestAnimationFrame(starLoop);
  }

  // ===================================================================
  //  NARRATIVE  (7-step opening story: 夜晚·一盏灯下 → 一盏灯 → 无名情绪 → 未造之字 → 亲手造字)

  const narvMoon = document.getElementById('narvMoon');

  let oW = 0, oH = 0, oDpr = 1;

  let oracleMode = 'idle';
  let oracleT0 = 0;
  let oracleRunning = false;
  let glassTrail = [];

  let skipRequested = false;
  const wait = (ms) => new Promise(r => { if (skipRequested) return r(); setTimeout(r, ms); });

  function resizeNarrative() {
    oW = window.innerWidth; oH = window.innerHeight;
    oDpr = Math.min(window.devicePixelRatio || 1, 2);
    [narvOracle, narvWipe, narvGlass, narvMotes, narvNight].forEach(c => {
      c.width = oW * oDpr; c.height = oH * oDpr;
      c.style.width = oW + 'px'; c.style.height = oH + 'px';
      c.getContext('2d').setTransform(oDpr, 0, 0, oDpr, 0, 0);
    });
    if (motesRAF) buildMotes();
    if (nightRAF) buildStars();
    if (oracleMode === 'scatter' || oracleMode === 'gather' || oracleMode === 'scatter2') {
      wctx.clearRect(0, 0, oW, oH);

  // ---- night sky: drifting starfield (step 00 动效优先) ----
  let stars = [];

  let nightRAF = 0;
  function buildStars() {
    // 夜空已按要求去除闪烁白星与流星，仅保留纯黑夜底与窗的静默
    stars = [];

  }
  function nightStep() {

  // ---- faint subtitle whisper (文字退为极淡旁白，动效为主) ----

  // ---- phone typing: 虚拟打字机——反复输入又逐字删掉，表现犹豫迷茫（不知道用什么字）----
  let phoneTypeTimer = 0;
  function startPhoneTyping() {
    const words = ['安心', '难过', '孤单', '开心', '害怕', '想说', '安宁', '委屈'];
    const holder = document.createElement('span');
    holder.className = 'narv-phone-type';
    narvPhone.insertBefore(holder, narvCursor);
    let wi = 0;
    const typeWord = (word, next) => {
      let i = 0;
      const step = () => {
        if (skipRequested || !narvPhone.classList.contains('on')) return;
        holder.textContent = word.slice(0, ++i);
        // 打字节奏不匀，带迟疑感
        if (i < word.length) phoneTypeTimer = setTimeout(step, 300 + Math.random() * 180);
        else phoneTypeTimer = setTimeout(next, 560);
      };
      step();
    };
    const eraseWord = (next) => {
      const del = () => {
        if (skipRequested || !narvPhone.classList.contains('on')) return;
        holder.textContent = holder.textContent.slice(0, -1);
        if (holder.textContent.length > 0) phoneTypeTimer = setTimeout(del, 150);
        else phoneTypeTimer = setTimeout(next, 420); // 删空后停一瞬，像叹气，再换一个词
      };
      del();
    };
    const cycle = () => {
      if (wi >= words.length) wi = 0; // 循环换词，直到用户轻触屏幕
      const w = words[wi++];
      typeWord(w, () => eraseWord(cycle));
    };
    cycle();
  }
  function stopPhoneTyping() {
    clearTimeout(phoneTypeTimer);
    narvPhone.querySelectorAll('.narv-phone-type').forEach(el => el.remove());
  }


  function buildStrobe() {
    narvStrobe.innerHTML = '';
    const glyphs = ['木','火','水','山','石','田','人','月','日','雨','风','心','川','泉','土','星','光','夜','墨','古'];
    const N = 28;
    for (let i = 0; i < N; i++) {
      const g = document.createElement('div');
      g.className = 'narv-glyph';
      g.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      g.style.left = (Math.random() * 100) + '%';
      g.style.top = (Math.random() * 100) + '%';
      g.style.fontSize = (1.6 + Math.random() * 2.4) + 'rem';
      g.style.animationDelay = (Math.random() * 16) + 's';
      g.style.animationDuration = (12 + Math.random() * 12) + 's';
      narvStrobe.appendChild(g);
    }
  }

  // ---- ambient warm motes (living, cozy particle field) ----
  let motes = [];
  let motesRAF = 0;
  function buildMotes() {
    const area = oW * oH;
    const count = Math.max(30, Math.min(72, Math.round(area / 24000)));
    motes = [];
    for (let i = 0; i < count; i++) {
      motes.push({
        x: Math.random() * oW,
        y: Math.random() * oH,
        r: 0.6 + Math.random() * 1.9,
        vy: -(0.05 + Math.random() * 0.22),
        sway: 4 + Math.random() * 10,
        ph: Math.random() * Math.PI * 2,
        sp: 0.4 + Math.random() * 0.9,
        a: 0.22 + Math.random() * 0.5,
        tw: 0.5 + Math.random() * 1.4
      });
    }
  }
  function motesStep(t) {
    nmctx.clearRect(0, 0, oW, oH);
    nmctx.globalCompositeOperation = 'screen';
    for (const m of motes) {
      m.y += m.vy;
      m.ph += 0.01 * m.sp;
      const x = m.x + Math.sin(m.ph) * m.sway;
      if (m.y < -12) { m.y = oH + 12; m.x = Math.random() * oW; }
      const tw = 0.55 + 0.45 * Math.sin(t * 0.001 * m.tw + m.ph);
      const alpha = m.a * tw;
      const rad = m.r * 6;
      const g = nmctx.createRadialGradient(x, m.y, 0, x, m.y, rad);
      g.addColorStop(0, 'rgba(255,210,150,' + alpha.toFixed(3) + ')');
      g.addColorStop(0.4, 'rgba(255,182,112,' + (alpha * 0.5).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,170,90,0)');
      nmctx.fillStyle = g;
      nmctx.beginPath(); nmctx.arc(x, m.y, rad, 0, Math.PI * 2); nmctx.fill();
    }
    nmctx.globalCompositeOperation = 'source-over';
    motesRAF = requestAnimationFrame(motesStep);
  }
  function startMotes() {
    if (motesRAF) return;
    buildMotes();
    narvMotes.classList.add('on');
    motesRAF = requestAnimationFrame(motesStep);
  }
  function stopMotes() {
    if (motesRAF) { cancelAnimationFrame(motesRAF); motesRAF = 0; }
    if (nmctx) nmctx.clearRect(0, 0, oW, oH);
    narvMotes.classList.remove('on');
  }

  function setText(str, opts = {}) {

      narvText.className = 'narv-text' + (opts.serif ? ' serif' : '') + (opts.gold ? ' gold' : '');

      setTimeout(resolve, total);

  function dissolveWords() {
    const spans = narvText.querySelectorAll('.ch');
    [9, 10, 11, 12].forEach((i, k) => {
      const s = spans[i];

      // like ink washed apart by water: each char drifts a random direction while blurring

      s.style.setProperty('--dx', dx.toFixed(1) + 'px');

  function spawnFragments() {

    document.querySelectorAll('.narv-frag').forEach(f => f.remove());

  // 「名」反复想成形却碎散：动效本身即「有些情绪，曾经没有名字」
  function playGhostName(times) {
    narvGhost.textContent = '名';
    let played = 0;
    const run = () => {
      narvGhost.classList.remove('try');
      void narvGhost.offsetWidth; // 强制回流以重启动画
      narvGhost.classList.add('try');
      played++;
      if (played < (times || 1)) narvGhost.addEventListener('animationend', run, { once: true });
    };
    run();
  }
  function clearGhost() {
    narvGhost.classList.remove('try');
    narvGhost.textContent = '';
    narvGhost.style.opacity = '0';
  }

  function ripple(x, y) {
    const r = document.createElement('div');
    r.className = 'narv-ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    narrative.appendChild(r);
    setTimeout(() => r.remove(), 1200);
  }

  function waitFirstTouch() {
    return new Promise(resolve => {
      if (skipRequested) return resolve({ x: oW / 2, y: oH / 2 });
      const h = (e) => {
        narrative.removeEventListener('pointerdown', h);
        resolve({ x: e.clientX, y: e.clientY });
      };
      narrative.addEventListener('pointerdown', h, { once: true });
    });
  }

  function pushGlass(x, y) {
    glassTrail.push({ x, y, age: 0, life: 24, r: 12 });
  }
  function drawGlassTrail(ctx) {
    for (let i = glassTrail.length - 1; i >= 0; i--) {
      const p = glassTrail[i]; p.age++;
      if (p.age >= p.life) { glassTrail.splice(i, 1); continue; }
    }
    if (!glassTrail.length) return;
    const last = glassTrail[glassTrail.length - 1];
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const g = ctx.createRadialGradient(last.x, last.y, 6, last.x, last.y, 34);
    g.addColorStop(0, 'rgba(245,240,230,0.20)');
    g.addColorStop(1, 'rgba(245,240,230,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(last.x, last.y, 34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < glassTrail.length - 1; i++) {
      const a = glassTrail[i], b = glassTrail[i + 1];
      const life = 1 - a.age / a.life;
      ctx.globalCompositeOperation = 'screen';
      ctx.strokeStyle = `rgba(230,220,200,${0.12 * life})`;
      ctx.lineWidth = 2 + life * 8;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.restore();
  }

  function wipeAt(x, y, r) {
    wctx.save();
    wctx.globalCompositeOperation = 'destination-out';
    const g = wctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    wctx.fillStyle = g;
    wctx.beginPath(); wctx.arc(x, y, r, 0, Math.PI * 2); wctx.fill();
    wctx.restore();
  }

  function enableWipe() {
    return new Promise(resolve => {
      if (skipRequested) return resolve();
      let resolved = false, erased = 0, lastPt = null;
      const finish = () => {
        if (resolved) return;
        resolved = true;
        narvWipe.removeEventListener('pointerdown', down);
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        wctx.clearRect(0, 0, oW, oH); // fully reveal
        resolve();
      };
      const down = (e) => { lastPt = { x: e.clientX, y: e.clientY }; wipeAt(lastPt.x, lastPt.y, 42); };
      const move = (e) => {
        if (!lastPt) lastPt = { x: e.clientX, y: e.clientY };
        wipeAt(e.clientX, e.clientY, 44);
        pushGlass(e.clientX, e.clientY);
        lastPt = { x: e.clientX, y: e.clientY };
        erased++;
        if (erased > 36) finish();
      };
      const up = () => { if (erased > 8) finish(); };
      narvWipe.addEventListener('pointerdown', down);
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      setTimeout(finish, 7000); // fallback: auto-reveal if no interaction
    });
  }

  // ---- 预加载弘磊板书：canvas 不会自动触发 @font-face 下载，需显式 load ----
  // 「字」字形已内嵌为 data URI（860B），毫秒级就绪；外部完整字体仅作回退
  let banshuPreload = null;
  function preloadBanshu() {
    if (banshuPreload) return banshuPreload;
    try {
      if (document.fonts && document.fonts.load) {
        banshuPreload = document.fonts.load("700 240px 'Honglei-Banshu'", '字').catch(() => {});
      } else {
        banshuPreload = Promise.resolve();
      }
    } catch (e) { banshuPreload = Promise.resolve(); }
    return banshuPreload;
  }
  function banshuReady(timeout) {
    return Promise.race([preloadBanshu(), new Promise(r => setTimeout(r, timeout || 2500))]);
  }

  function startOracle() {
    oracleGlyphs = [];
    const n = 14;
    for (let i = 0; i < n; i++) {
      const sx = oW * (0.18 + Math.random() * 0.64);
      const sy = oH * (0.18 + Math.random() * 0.64);
      oracleGlyphs.push({
        ch: ORACLE_CHARS[i % ORACLE_CHARS.length],
        sx, sy, x: sx, y: sy,
        size: 40 + Math.random() * 44,
        rot: (Math.random() - 0.5) * 0.5,
        ang: Math.atan2(sy - oH / 2, sx - oW / 2),
        dist: Math.hypot(sx - oW / 2, sy - oH / 2),
        alpha: 1
      });
    }
    wctx.clearRect(0, 0, oW, oH);
    wctx.fillStyle = '#000'; wctx.fillRect(0, 0, oW, oH);
    gctx.clearRect(0, 0, oW, oH);
    oracleMode = 'scatter';
    oracleT0 = performance.now();
    if (!oracleRunning) { oracleRunning = true; requestAnimationFrame(oracleLoop); }
  }

  function oracleLoop() {
    if (oracleMode === 'idle') { oracleRunning = false; return; }
    const now = performance.now();
    const t = (now - oracleT0) / 1000;

    octx.clearRect(0, 0, oW, oH);
    for (const g of oracleGlyphs) {
      let x = g.x, y = g.y, a = g.alpha;
      if (oracleMode === 'gather') {
        const p = Math.min(1, (now - oracleT0) / 1400);
        const e = 1 - Math.pow(1 - p, 3);
        x = g.sx + (oW / 2 - g.sx) * e;
        y = g.sy + (oH / 2 - g.sy) * e;
        a = Math.max(0, 1 - p * 0.55);
      } else if (oracleMode === 'scatter2') {
        const p = Math.min(1, (now - oracleT0) / 1400);
        const dx = g.sx - oW / 2, dy = g.sy - oH / 2;
        x = oW / 2 + dx * (1 + p * 3);
        y = oH / 2 + dy * (1 + p * 3);
        a = Math.max(0, 1 - p);
      }
      octx.save();
      octx.globalAlpha = a;
      octx.fillStyle = '#c9a85a';
      octx.shadowBlur = 18; octx.shadowColor = 'rgba(201,168,86,0.6)';
      octx.font = `700 ${g.size}px 'Songti SC','STSong','SimSun',serif`;
      octx.textAlign = 'center'; octx.textBaseline = 'middle';
      octx.translate(x, y); octx.rotate(g.rot);
      octx.fillText(g.ch, 0, 0);
      octx.restore();
    }
    if (oracleMode === 'gather' && t > 1.4) {
      octx.save();
      octx.globalAlpha = Math.min(1, (t - 1.4) / 0.6);
      octx.fillStyle = '#e8d9a8';
      octx.shadowBlur = 40; octx.shadowColor = 'rgba(201,168,86,0.8)';
      // 弘磊板书：古字汇聚成的那个「字」，用书法感更强的板书体（未加载完时回退宋体）
      octx.font = `700 ${Math.min(oW, oH) * 0.28}px 'Honglei-Banshu','Songti SC','STSong','SimSun',serif`;
      octx.textAlign = 'center'; octx.textBaseline = 'middle';
      octx.fillText('字', oW / 2, oH / 2);
      octx.restore();
    }

    gctx.clearRect(0, 0, oW, oH);
    if (oracleMode === 'scatter') drawGlassTrail(gctx);

    requestAnimationFrame(oracleLoop);
  }

  function gatherWord() {
    return new Promise(resolve => {
      if (skipRequested) { oracleMode = 'idle'; gctx.clearRect(0, 0, oW, oH); return resolve(); }
      oracleMode = 'gather';
      oracleT0 = performance.now();
      setTimeout(() => {
        oracleMode = 'scatter2';
        oracleT0 = performance.now();
        setTimeout(() => {
          oracleMode = 'idle';
          gctx.clearRect(0, 0, oW, oH);
          resolve();
        }, 1500);
      }, 2400);
    });
  }

  function revealGallery() {

  // ===== 6-step narrative sound toggle (右上角声音按钮) =====
  const narvSound = document.getElementById('narvSound');
  const narvBgm = new Audio('zizaoji4_final_xuanxuan_audio_button/zizaoji4_final_xuanxuan_audio_button/assets/audio/bgm/home-guqin.mp3');
  narvBgm.loop = true;

  if (narvSound) {
    // 初始化：开场页声音按钮默认「开启」，与主程序（背景音乐 + 音效）共用同一静音状态
    const initialMuted = narvSound.classList.contains('muted');
    window.__zizaojiMuted = initialMuted;

    // 浏览器自动播放策略：需用户手势后才能播放。首次交互（进入字造集/点击等）即解锁并播放首页 BGM。
    let homeBgmStarted = false;

    // 阻止冒泡，避免点声音按钮时误触推进叙事步骤

      const nowMuted = narvSound.classList.toggle('muted');

      window.__zizaojiMuted = nowMuted;
      try { localStorage.setItem('zizaoji_music_muted', nowMuted ? '1' : '0'); } catch (e2) {}
      if (nowMuted) narvBgm.pause();
      else { homeBgmStarted = true; narvBgm.play().catch(() => {}); }

  // ===== 6-step narrative skip button (右上角跳过) =====
  const narvSkip = document.getElementById('narvSkip');
  if (narvSkip) {
    // 阻止冒泡，避免点跳过时误触推进叙事步骤
    narvSkip.addEventListener('pointerdown', (e) => e.stopPropagation());
